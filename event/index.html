<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>이벤트 - NewAnime</title>
  <meta name="description" content="NewAnime 이벤트 페이지입니다." />
  <link rel="canonical" href="https://newani.me/event/?lang=ko" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260909-icon1" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0d13;
      color: #f4f6fb;
      font-family: Pretendard, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    .shell { width: min(1080px, calc(100% - 32px)); margin: 0 auto; }
    .header {
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 18px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .brand { display: inline-flex; align-items: center; }
    .brand img { width: 152px; height: auto; display: block; }
    .spacer { flex: 1; }
    .langs { display: flex; gap: 5px; }
    .langs button {
      height: 32px;
      min-width: 40px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 9px;
      background: rgba(255,255,255,.035);
      color: #8993a6;
      font: inherit;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }
    .langs button.active { color: #fff; border-color: rgba(142,161,255,.3); background: rgba(142,161,255,.11); }
    .main {
      min-height: calc(100vh - 77px);
      display: grid;
      place-items: center;
      padding: 72px 0 110px;
    }
    .card {
      width: min(680px, 100%);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      background:
        radial-gradient(circle at 20% 0%, rgba(127,145,255,.12), transparent 38%),
        rgba(255,255,255,.025);
      box-shadow: 0 28px 80px rgba(0,0,0,.28);
      text-align: center;
    }
    .kicker { margin-bottom: 18px; color: #9aa6ff; font-size: 11px; font-weight: 900; letter-spacing: .16em; }
    h1 { margin: 0; font-size: clamp(34px, 8vw, 58px); letter-spacing: -.045em; }
    p { margin: 18px auto 0; max-width: 460px; color: #aeb6c6; font-size: 15px; line-height: 1.75; }
    .home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      margin-top: 30px;
      padding: 0 18px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 11px;
      background: rgba(255,255,255,.05);
      color: #eef1f8;
      font-size: 13px;
      font-weight: 800;
    }
    .home:hover, .home:focus-visible { background: rgba(255,255,255,.09); outline: none; }
    @media (max-width: 560px) {
      .shell { width: min(100% - 22px, 1080px); }
      .header { min-height: 64px; }
      .brand img { width: 132px; }
      .main { min-height: calc(100vh - 65px); padding-block: 46px 80px; }
      .card { border-radius: 19px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <a class="brand" href="/?lang=ko" id="brandLink" aria-label="NewAnime">
        <img src="/assets/newanime-logo.svg?v=20260909-logo2" alt="NewAnime" />
      </a>
      <div class="spacer"></div>
      <div class="langs" aria-label="언어 선택">
        <button type="button" data-lang="ko">KR</button>
        <button type="button" data-lang="ja">JP</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </header>

    <main class="main">
      <section class="card" aria-labelledby="eventTitle">
        <div class="kicker">NEWANI.ME · EVENT</div>
        <h1 id="eventTitle">이벤트</h1>
        <p id="eventDescription">이벤트 페이지를 준비하고 있습니다. 자세한 내용은 곧 이곳에서 안내합니다.</p>
        <a class="home" id="homeLink" href="/?lang=ko">홈으로 돌아가기</a>
      </section>
    </main>
  </div>

  <script>
    (() => {
      const copy = {
        ko: { title: '이벤트', description: '이벤트 페이지를 준비하고 있습니다. 자세한 내용은 곧 이곳에서 안내합니다.', home: '홈으로 돌아가기', pageTitle: '이벤트 - NewAnime', language: '언어 선택' },
        ja: { title: 'イベント', description: 'イベントページを準備しています。詳細は近日こちらでお知らせします。', home: 'ホームへ戻る', pageTitle: 'イベント - NewAnime', language: '言語を選択' },
        en: { title: 'Event', description: 'The event page is being prepared. Details will be announced here soon.', home: 'Back to home', pageTitle: 'Event - NewAnime', language: 'Select language' }
      };
      const params = new URLSearchParams(location.search);
      let lang = params.get('lang');
      if (!copy[lang]) {
        try { lang = localStorage.getItem('animeScheduleLang'); } catch (_) {}
      }
      if (!copy[lang]) lang = navigator.language?.toLowerCase().startsWith('ja') ? 'ja' : navigator.language?.toLowerCase().startsWith('ko') ? 'ko' : 'en';

      const apply = next => {
        lang = copy[next] ? next : 'ko';
        try { localStorage.setItem('animeScheduleLang', lang); } catch (_) {}
        document.documentElement.lang = lang;
        document.title = copy[lang].pageTitle;
        document.getElementById('eventTitle').textContent = copy[lang].title;
        document.getElementById('eventDescription').textContent = copy[lang].description;
        document.getElementById('homeLink').textContent = copy[lang].home;
        document.getElementById('homeLink').href = `/?lang=${lang}`;
        document.getElementById('brandLink').href = `/?lang=${lang}`;
        document.querySelector('.langs').setAttribute('aria-label', copy[lang].language);
        document.querySelectorAll('[data-lang]').forEach(button => button.classList.toggle('active', button.dataset.lang === lang));
        const url = new URL(location.href);
        url.searchParams.set('lang', lang);
        history.replaceState(null, '', url);
      };

      document.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click', () => apply(button.dataset.lang)));
      apply(lang);
    })();
  </script>
</body>
</html>
