  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-jp.css" />

  <style>
    :root {
      --bg: #0b0d12;
      --panel: rgba(20, 23, 32, 0.78);
      --panel-2: rgba(29, 33, 45, 0.88);
      --line: rgba(255,255,255,.09);
      --text: #f6f7fb;
      --muted: #9ba3b4;
      --accent: #8ea1ff;
      --accent-2: #b28cff;
      --good: #73ddb1;
      --warn: #ffc979;
      --shadow: 0 18px 60px rgba(0,0,0,.35);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html, body, button, input, select, textarea {
      font-family: "Pretendard Variable", "Pretendard JP", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard Variable", "Pretendard JP", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(119, 91, 255, .16), transparent 30rem),
        radial-gradient(circle at 90% 20%, rgba(77, 160, 255, .10), transparent 34rem),
        linear-gradient(180deg, #090b10 0%, #0d1017 45%, #0a0c11 100%);
    }

    a { color: inherit; }

    .shell {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 38px 0 80px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background:
        linear-gradient(135deg, rgba(132, 111, 255, .14), rgba(59, 102, 176, .06)),
        rgba(16, 19, 27, .82);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      right: -110px;
      top: -150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(178,140,255,.32), transparent 68%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 7px 11px;
      border-radius: 999px;
      color: #d8dcff;
      background: rgba(142,161,255,.11);
      border: 1px solid rgba(142,161,255,.2);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0 10px;
      max-width: 860px;
      font-size: clamp(30px, 5vw, 58px);
      line-height: 1.02;
      letter-spacing: -.045em;
    }

    .hero p {
      margin: 0;
      max-width: 850px;
      color: var(--muted);
      line-height: 1.72;
      font-size: 15px;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 12px;
      margin-top: 26px;
    }

    .stat {
      padding: 17px 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.035);
    }

    .stat b {
      display: block;
      font-size: 24px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      position: sticky;
      top: 10px;
      z-index: 20;
      margin: 20px 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(11,13,18,.82);
      backdrop-filter: blur(18px);
      box-shadow: 0 12px 35px rgba(0,0,0,.22);
    }


    .mobile-toolbar-head {
      display: none;
    }

    .toolbar-body {
      display: block;
    }

    .mobile-toolbar-head button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 850;
    }

    #mobileToolbarTitle {
      white-space: nowrap;
    }

    #mobileToolbarIcon {
      flex: 0 0 auto;
      font-size: 16px;
      line-height: 1;
      opacity: .9;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 10px;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.035);
    }

    .search-wrap span { opacity: .7; }

    #search {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
    }

    #search::placeholder { color: #687184; }

    button, .chip {
      border: 1px solid var(--line);
      color: var(--text);
      background: rgba(255,255,255,.035);
      border-radius: 12px;
      padding: 10px 13px;
      font: inherit;
      cursor: pointer;
      transition: .18s ease;
    }

    button:hover, .chip:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.065);
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .chip {
      font-size: 12px;
      font-weight: 750;
    }

    .chip.active {
      color: #fff;
      border-color: rgba(142,161,255,.42);
      background: linear-gradient(135deg, rgba(142,161,255,.24), rgba(178,140,255,.18));
    }

    .month-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 3px 0 10px;
      scrollbar-width: thin;
    }

    .month-nav a {
      flex: 0 0 auto;
      text-decoration: none;
      color: var(--muted);
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.025);
      font-size: 12px;
      font-weight: 800;
    }

    .month-nav a:hover { color: #fff; }

    .season-divider {
      margin: 34px 0 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .season-divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, var(--line), transparent);
    }

    .season-divider h2 {
      margin: 0;
      font-size: 14px;
      color: #d9dded;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .month {
      margin: 16px 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 10px 35px rgba(0,0,0,.18);
    }

    .month-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 15px;
    }

    .month-head h3 {
      margin: 0;
      font-size: 26px;
      letter-spacing: -.03em;
    }

    .month-head small {
      color: var(--muted);
      font-weight: 700;
    }

    .month-count {
      color: #cbd1df;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.045);
      font-size: 12px;
      white-space: nowrap;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
    }

    .card {
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.018));
      transition: .18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(142,161,255,.25);
      background: linear-gradient(180deg, rgba(142,161,255,.06), rgba(255,255,255,.022));
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .title {
      font-size: 15px;
      font-weight: 850;
      line-height: 1.45;
    }

    .date {
      flex: 0 0 auto;
      color: #dce1ff;
      font-size: 11px;
      font-weight: 850;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(142,161,255,.10);
      border: 1px solid rgba(142,161,255,.16);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .badge {
      padding: 5px 7px;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.035);
      border: 1px solid var(--line);
      font-size: 10px;
      font-weight: 800;
    }

    .badge.major {
      color: #d9e5ff;
      background: rgba(93,143,255,.09);
    }

    .badge.follow {
      color: #d8f6e9;
      background: rgba(115,221,177,.07);
    }


    .badge.series {
      color: #d9dcff;
      background: rgba(142,161,255,.08);
    }

    .badge.comic {
      color: #ffd9c1;
      background: rgba(255,164,108,.075);
    }

    .badge.ln {
      color: #e6d6ff;
      background: rgba(178,140,255,.075);
    }

    .badge.original {
      color: #cceee5;
      background: rgba(115,221,177,.07);
    }

    .badge.movie {
      color: #ffe2ad;
      background: rgba(255,201,121,.075);
    }

    .empty {
      grid-column: 1 / -1;
      padding: 25px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 16px;
    }

    .undated {
      margin-top: 32px;
      border: 1px solid rgba(255,201,121,.18);
      border-radius: var(--radius);
      background: rgba(255,201,121,.035);
      overflow: hidden;
    }

    #undatedToggle {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 0;
      border-radius: 0;
      padding: 18px 20px;
      background: transparent;
      text-align: left;
      font-weight: 900;
    }

    .undated-item .stream-trigger:not(:disabled) {
      color: #e8ebff;
      border: 1px solid rgba(142,161,255,.26);
      background: linear-gradient(135deg, rgba(142,161,255,.12), rgba(178,140,255,.075));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.018);
    }

    .undated-item .stream-trigger:not(:disabled):hover {
      border-color: rgba(142,161,255,.48);
      background: linear-gradient(135deg, rgba(142,161,255,.18), rgba(178,140,255,.11));
    }

    .undated-content {
      padding: 0 20px 20px;
    }

    .undated-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 8px;
    }

    .undated-item {
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,255,255,.025);
      color: #d7d9e2;
      font-size: 13px;
    }

    .source-box, footer {
      margin-top: 26px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .source-box {
      padding: 17px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.025);
    }

    .source-box strong { color: #e5e8f0; }

    .source-box a {
      color: #bdc8ff;
      text-decoration: none;
      border-bottom: 1px dotted rgba(189,200,255,.4);
    }


    .filter-group {
      margin-top: 12px;
    }

    .filter-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px 2px;
      color: #7f899c;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .year-filter {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .year-chip {
      min-height: 44px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .02em;
    }

    .year-chip.active {
      border-color: rgba(142,161,255,.48);
      background:
        linear-gradient(135deg, rgba(142,161,255,.28), rgba(178,140,255,.18));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.035);
    }

    .month-nav button {
      flex: 0 0 auto;
      color: var(--muted);
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.025);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .month-nav button.active {
      color: #fff;
      border-color: rgba(142,161,255,.42);
      background: rgba(142,161,255,.15);
    }

    .resource-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 7px;
      margin-top: 13px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.065);
    }

    .resource-btn {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 8px;
      border-radius: 10px;
      border: 1px solid rgba(142,161,255,.18);
      background: rgba(142,161,255,.075);
      color: #dfe4ff;
      text-decoration: none;
      font-size: 10px;
      font-weight: 850;
      transition: .18s ease;
    }

    a.resource-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(142,161,255,.4);
      background: rgba(142,161,255,.14);
    }

    .resource-btn .external {
      opacity: .65;
      font-size: 9px;
    }

    .resource-btn.disabled {
      color: #5e6676;
      border-color: rgba(255,255,255,.045);
      background: rgba(255,255,255,.018);
      cursor: not-allowed;
      user-select: none;
    }

    .undated-item .resource-actions {
      margin-top: 10px;
    }

    .undated-title {
      color: #e1e4ec;
      font-weight: 820;
      line-height: 1.45;
    }

    .year-summary {
      margin: 18px 0 4px;
      color: #8f98aa;
      font-size: 12px;
      font-weight: 750;
    }


    .stream-trigger {
      width: 100%;
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 8px;
      border-radius: 10px;
      border: 1px solid rgba(142,161,255,.18);
      background: rgba(142,161,255,.075);
      color: #dfe4ff;
      font-size: 10px;
      font-weight: 850;
      cursor: pointer;
      transition: .18s ease;
    }

    .stream-trigger:hover {
      transform: translateY(-1px);
      border-color: rgba(142,161,255,.4);
      background: rgba(142,161,255,.14);
    }

    .stream-trigger.disabled,
    .stream-trigger:disabled {
      color: #5e6676;
      border-color: rgba(255,255,255,.045);
      background: rgba(255,255,255,.018);
      cursor: not-allowed;
      transform: none;
    }

    body.modal-open {
      overflow: hidden;
    }

    .stream-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .stream-modal.hidden {
      display: none !important;
    }

    .stream-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(4, 6, 10, .74);
      backdrop-filter: blur(8px);
      animation: modalFade .16s ease-out;
    }

    .stream-dialog {
      position: relative;
      z-index: 1;
      width: min(560px, 100%);
      max-height: min(760px, calc(100vh - 36px));
      overflow: auto;
      padding: 22px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 24px;
      background:
        radial-gradient(circle at 90% 0%, rgba(142,161,255,.12), transparent 18rem),
        #11151e;
      box-shadow: 0 28px 90px rgba(0,0,0,.55);
      animation: modalUp .18s ease-out;
    }

    .stream-dialog-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    .stream-dialog-head h4 {
      margin: 0;
      max-width: 430px;
      font-size: 19px;
      line-height: 1.45;
      letter-spacing: -.025em;
    }

    .stream-dialog-kicker {
      margin-bottom: 6px;
      color: #8993a7;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .stream-close {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 11px;
      color: #cdd2df;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      font-size: 19px;
      line-height: 1;
    }

    .stream-dialog-desc {
      margin: 12px 0 17px;
      color: #8e97a9;
      font-size: 12px;
      line-height: 1.65;
    }

    .ott-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 9px;
    }

    .ott-option {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 13px;
      border-radius: 14px;
      border: 1px solid rgba(142,161,255,.17);
      background: rgba(142,161,255,.06);
      color: #edf0ff;
      text-decoration: none;
      transition: .18s ease;
    }

    a.ott-option:hover {
      transform: translateY(-1px);
      border-color: rgba(142,161,255,.38);
      background: rgba(142,161,255,.12);
    }

    .ott-option.disabled {
      color: #596171;
      border-color: rgba(255,255,255,.04);
      background: rgba(255,255,255,.015);
      cursor: not-allowed;
      user-select: none;
    }

    .ott-option-name {
      font-size: 12px;
      font-weight: 900;
    }

    .ott-option-state {
      flex: 0 0 auto;
      padding: 4px 6px;
      border-radius: 999px;
      color: #9eabd0;
      background: rgba(142,161,255,.09);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .ott-option.disabled .ott-option-state {
      color: #505867;
      background: rgba(255,255,255,.025);
    }

    .stream-dialog-note {
      margin: 16px 0 0;
      padding: 12px 13px;
      border: 1px solid rgba(255,255,255,.055);
      border-radius: 12px;
      background: rgba(255,255,255,.022);
      color: #7e8799;
      font-size: 10px;
      line-height: 1.6;
    }

    @keyframes modalFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modalUp {
      from { opacity: 0; transform: translateY(10px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }


    @media (max-width: 720px) {
      .mobile-toolbar-head {
        display: block;
        margin-bottom: 2px;
      }

      .toolbar-body {
        overflow: hidden;
        max-height: 2400px;
        opacity: 1;
        transition: max-height .26s ease, opacity .2s ease, margin .2s ease;
      }

      .toolbar.is-mobile-collapsed .toolbar-body {
        max-height: 0;
        opacity: 0;
        pointer-events: none;
      }
    }

    @media (max-width: 520px) {
      .stream-dialog {
        padding: 18px;
        border-radius: 20px;
      }

      .ott-grid {
        grid-template-columns: 1fr;

function safeStorageGet(key) {
  try { return window.localStorage.getItem(key); } catch (_) { return null; }
}

function safeStorageSet(key, value) {
  try { window.localStorage.setItem(key, value); } catch (_) {}
}

let activeLang = safeStorageGet("animeScheduleLang") || "ko";
if (!["ko","ja","en"].includes(activeLang)) activeLang = "ko";

function t(key) {
  return uiLocales[activeLang]?.[key] ?? uiLocales.ko[key] ?? key;
}

function localTitle(title) {
  return titleLocales[title]?.[activeLang] || titleLocales[title]?.ko || title;
}

function localSeason(season) {
  return seasonLocales[season]?.[activeLang] || season;
}

function localMonthName(year, month) {
  if (activeLang === "ko") return `${year}년 ${month}월`;
  if (activeLang === "ja") return `${year}年${month}月`;
  return new Intl.DateTimeFormat("en-US", { month: "long", year: "numeric" })
    .format(new Date(year, month - 1, 1));
}

function localDateLabel(date) {
  if (/^\d+\/\d+$/.test(date)) return date;
  const monthMatch = date.match(/^(\d+)월$/);
  if (monthMatch) {
    const m = Number(monthMatch[1]);
    if (activeLang === "ko") return `${m}월`;
    if (activeLang === "ja") return `${m}月`;
    return new Intl.DateTimeFormat("en-US", { month: "short" }).format(new Date(2027, m - 1, 1));
  }
  if (date === "연말") return activeLang === "ko" ? "연말" : activeLang === "ja" ? "年末" : "Year-end";
  if (date === "가을") return activeLang === "ko" ? "가을" : activeLang === "ja" ? "秋" : "Fall";
  return date;
}

function categoryLabel(tag) {
  const key = filterNames[tag] || tag;
  return t(key) || tag;
}

function updateToolbarCollapse() {
  if (!toolbarEl || !mobileToolbarToggle) return;

  const effectiveCollapsed = mobileToolbarQuery.matches ? toolbarCollapsed : false;
  toolbarEl.classList.toggle("is-mobile-collapsed", effectiveCollapsed);
  mobileToolbarToggle.setAttribute("aria-expanded", String(!effectiveCollapsed));
  mobileToolbarToggle.setAttribute("aria-label", t(effectiveCollapsed ? "showFilters" : "hideFilters"));
  mobileToolbarToggle.title = t(effectiveCollapsed ? "showFilters" : "hideFilters");

  const titleEl = document.getElementById("mobileToolbarTitle");
  const iconEl = document.getElementById("mobileToolbarIcon");
  if (titleEl) titleEl.textContent = t("searchFilters");
  if (iconEl) iconEl.textContent = effectiveCollapsed ? "＋" : "－";
}

function updateCategoryCollapse() {
  const group = document.getElementById("categoryGroup");
  const toggle = document.getElementById("categoryToggle");
  const icon = document.getElementById("categoryToggleIcon");
  if (!group || !toggle) return;

  group.classList.toggle("is-collapsed", categoryCollapsed);
  toggle.setAttribute("aria-expanded", String(!categoryCollapsed));
  toggle.setAttribute("aria-label", t(categoryCollapsed ? "expand" : "collapse"));
  toggle.title = t(categoryCollapsed ? "expand" : "collapse");
  if (icon) icon.textContent = "⌃";
}


function posterMarkup(title) {
  const url = posterLinks[title];

  if (!url) {
    return `
      <div class="poster-frame" aria-label="${localTitle(title)}">
        <div class="poster-fallback" aria-hidden="true">?</div>
      </div>
    `;
  }

  return `
    <div class="poster-frame has-image" aria-label="${localTitle(title)}">
      <img
        src="${url}"
        alt="${localTitle(title)}"
        data-poster-title="${encodeURIComponent(title)}"
        loading="lazy"
        decoding="async"
        referrerpolicy="no-referrer"
        onerror="this.closest('.poster-frame').classList.add('poster-error')"
      >
      <div class="poster-fallback" aria-hidden="true">?</div>
    </div>
  `;
}

function applyPosterPositions(root = document) {
  root.querySelectorAll(".poster-frame img[data-poster-title]").forEach(img => {
    const title = decodeURIComponent(img.dataset.posterTitle);
    img.style.objectPosition = posterPositions[title] || "center center";
  });
}

function getLinks(title) {
  return resourceLinks[title] || { pv: null, official: null, streaming: null };
}

function getOttLinks(title) {
  return ottLinks[title] || {};
}

function hasOttLink(title) {
  return Object.values(getOttLinks(title)).some(Boolean);
}

function resourceButton(url, label, shortLabel = null) {
  const labelMarkup = shortLabel
    ? `<span class="resource-label-long">${label}</span><span class="resource-label-short">${shortLabel}</span>`
    : `<span>${label}</span>`;

  if (!url) {
    return `<span class="resource-btn disabled" aria-disabled="true">${labelMarkup}</span>`;
  }

  return `<a class="resource-btn" href="${url}" target="_blank" rel="noopener noreferrer">${labelMarkup}<span class="external">↗</span></a>`;
}

function streamingButton(title) {
  if (!hasOttLink(title)) {
    return `<button class="stream-trigger disabled" type="button" disabled >${t("streaming")}</button>`;
  }

  return `<button class="stream-trigger" type="button" data-stream-title="${encodeURIComponent(title)}">${t("streaming")} <span class="external">▾</span></button>`;
}

function isXLink(url) {
  if (!url) return false;
  try {
    const host = new URL(url, window.location.href).hostname.toLowerCase();
    return host === "x.com" || host.endsWith(".x.com") ||
           host === "twitter.com" || host.endsWith(".twitter.com");
  } catch (_) {
    return false;
  }
}

function resourceActions(title) {
  const links = getLinks(title);
  const officialIsX = isXLink(links.official);
  const officialLabel = officialIsX ? "X" : t("official");
  const officialShortLabel = officialIsX ? "X" : t("officialShort");

  return `
    <div class="resource-actions">
      ${resourceButton(links.pv, t("pv"))}
      ${resourceButton(links.official, officialLabel, officialShortLabel)}
      ${streamingButton(title)}
    </div>
  `;
}


const streamModal = document.getElementById("streamModal");
const streamModalTitle = document.getElementById("streamModalTitle");
const ottGrid = document.getElementById("ottGrid");
let lastStreamTrigger = null;

function openStreamingModal(title, trigger = null) {
  const links = getOttLinks(title);
  lastStreamTrigger = trigger;

  streamModalTitle.textContent = localTitle(title);
  const availablePlatforms = ottPlatforms.filter(platform => links[platform.id]);

  ottGrid.innerHTML = availablePlatforms.map(platform => {
    const url = links[platform.id];
    return `
      <a class="ott-option" href="${url}" target="_blank" rel="noopener noreferrer">
        <span class="ott-option-name">${platform.name}</span>
        <span class="ott-option-state">${t("open")}</span>
      </a>
    `;
  }).join("");

  streamModal.classList.remove("hidden");
  document.body.classList.add("modal-open");

  const closeButton = streamModal.querySelector(".stream-close");
  requestAnimationFrame(() => closeButton?.focus());
}

function closeStreamingModal() {
  if (streamModal.classList.contains("hidden")) return;

  streamModal.classList.add("hidden");
  document.body.classList.remove("modal-open");

  if (lastStreamTrigger) {
    lastStreamTrigger.focus();
    lastStreamTrigger = null;
  }
}

document.addEventListener("click", event => {
  const trigger = event.target.closest("[data-stream-title]");
  if (trigger) {
    const title = decodeURIComponent(trigger.dataset.streamTitle);
    openStreamingModal(title, trigger);
    return;
  }

  if (event.target.closest("[data-stream-close]")) {
    closeStreamingModal();
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeStreamingModal();
});

function updateTitleScrolls() {
  requestAnimationFrame(() => {
    document.querySelectorAll(".title-scroll, .undated-title-scroll").forEach(wrapper => {
      const inner = wrapper.firstElementChild;
      if (!inner || wrapper.clientWidth <= 0) return;

      wrapper.classList.remove("is-overflowing", "has-scrolled");
      wrapper.style.removeProperty("--scroll-distance");
      wrapper.style.removeProperty("--scroll-duration");
      inner.style.removeProperty("transform");

      // Measure the natural wrapped title height before deciding to marquee.
      inner.classList.add("measure-title");
      const style = getComputedStyle(inner);
      const lineHeight = parseFloat(style.lineHeight) || parseFloat(style.fontSize) * 1.2;
      const naturalHeight = inner.scrollHeight;
      inner.classList.remove("measure-title");

      const exceedsTwoLines = naturalHeight > (lineHeight * 2 + 2);
      if (!exceedsTwoLines) return;

      wrapper.classList.add("is-overflowing");

      // Now that it is single-line, measure the horizontal travel distance.
      const overflow = Math.max(0, Math.ceil(inner.scrollWidth - wrapper.clientWidth));
      wrapper.style.setProperty("--scroll-distance", `${overflow + 8}px`);

      const duration = Math.max(8, Math.min(22, 6 + overflow / 28));
      wrapper.style.setProperty("--scroll-duration", `${duration}s`);

      const markScrolled = () => wrapper.classList.add("has-scrolled");
      inner.addEventListener("animationiteration", markScrolled, { once: true });
    });
  });
}

let titleResizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(titleResizeTimer);
  titleResizeTimer = setTimeout(updateTitleScrolls, 120);
});

function render() {
  const q = searchEl.value.trim().toLowerCase();
  let previousSeason = "";

  const visibleMonths = data.filter(month => {
    const yearOk = Number(month.month.slice(0, 4)) === activeYear;
    const monthOk = activeMonth === "all" || month.month === activeMonth;
    return yearOk && monthOk;
  });

  scheduleEl.innerHTML = `
    <div class="year-summary">${activeLang === "ko" ? activeYear + "년" : activeLang === "ja" ? activeYear + "年" : activeYear} · ${activeMonth === "all" ? t("allMonths") : (activeLang === "en" ? new Intl.DateTimeFormat("en-US",{month:"long"}).format(new Date(activeYear, Number(activeMonth.slice(5,7))-1, 1)) : Number(activeMonth.slice(5,7)) + t("monthSuffix"))}</div>
  ` + visibleMonths.map(month => {
    const items = month.items.filter(([title, date, tags]) => {
      const searchPool = [title, ...Object.values(titleLocales[title] || {})].join(" ").toLowerCase();
      const searchOk = !q || searchPool.includes(q);
      const filterOk = activeFilter === "all" || tags.includes(activeFilter);
      return searchOk && filterOk;
    });

    const seasonHeader = month.season !== previousSeason
      ? `<div class="season-divider"><h2>${localSeason(month.season)}</h2></div>`
      : "";

    previousSeason = month.season;

    const cards = items.length
      ? items.map(([title, date, tags]) => `
          <article class="card">
            <div class="card-layout">
              ${posterMarkup(title)}
              <div class="card-content">
                <div class="card-top">
                  <div class="title-scroll"><div class="title title-scroll-inner">${localTitle(title)}</div></div>
                  <div class="date">${localDateLabel(date)}</div>
                </div>
                <div class="meta">
                  ${tags.map(tag => `<span class="badge ${tag}">${categoryLabel(tag)}</span>`).join("")}
                </div>
                ${resourceActions(title)}
              </div>
            </div>
          </article>
        `).join("")
      : `<div class="empty">${
          month.items.length === 0
            ? t("noConfirmed")
            : t("noItems")
        }</div>`;

    return `
      ${seasonHeader}
      <section class="month" id="m-${month.month}">
        <div class="month-head">
          <div>
            <h3>${localMonthName(Number(month.month.slice(0,4)), Number(month.month.slice(5,7)))}</h3>
            <small>${localSeason(month.season)}</small>
          </div>
          <span class="month-count">${activeLang === "ja" ? items.length + "作品" : activeLang === "en" ? items.length + " titles" : items.length + "작품"}</span>
        </div>
        <div class="cards">${cards}</div>
      </section>
    `;
  }).join("");

  renderUndated();
  applyPosterPositions();
  updateTitleScrolls();
}
