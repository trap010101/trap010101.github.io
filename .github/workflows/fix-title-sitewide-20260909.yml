name: Fix requested titles site-wide

on:
  push:
    paths:
      - '.github/workflows/fix-title-sitewide-20260909.yml'

permissions:
  contents: write

jobs:
  fix-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace stale Korean titles across source and static files
        shell: python
        run: |
          from pathlib import Path

          replacements = [
              ('타코피의 원죄 -고마워, 또 내일-', '타코피의 원죄 -고마워, 또 만나'),
              ('타코피의 원죄 -고마워, 또 내일', '타코피의 원죄 -고마워, 또 만나'),
              ('타코피의 원죄 -고마워, 또 만나-', '타코피의 원죄 -고마워, 또 만나'),
              ('옆자리 아랴 양 2기', '가끔씩 툭하고 러시아어로 부끄러워하는 옆자리의 아랴 양 Season 2'),
          ]

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in {'.html', '.js'}:
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Direct replacements:', len(changed))
          for item in changed:
              print(item)

      - name: Regenerate anime detail and archive pages
        run: node scripts/generate-anime-pages.js

      - name: Verify requested titles
        shell: python
        run: |
          from pathlib import Path

          takopi = '타코피의 원죄 -고마워, 또 만나'
          takopi_old = ['타코피의 원죄 -고마워, 또 내일-', '타코피의 원죄 -고마워, 또 내일', '타코피의 원죄 -고마워, 또 만나-']
          alya = '가끔씩 툭하고 러시아어로 부끄러워하는 옆자리의 아랴 양 Season 2'

          takopi_detail = Path('anime/takopis-original-sin-thank-you-see-you-tomorrow/index.html').read_text(encoding='utf-8')
          alya_detail = Path('anime/alya-sometimes-hides-her-feelings-in-russian-season-2/index.html').read_text(encoding='utf-8')

          if takopi not in takopi_detail:
              raise SystemExit('Takopi corrected title missing from generated detail page')
          if any(old in takopi_detail for old in takopi_old):
              raise SystemExit('Stale Takopi title remains in generated detail page')
          if alya not in alya_detail:
              raise SystemExit('Alya corrected title missing from generated detail page')

      - name: Commit site-wide correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Fix Takopi and Alya titles site-wide [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
