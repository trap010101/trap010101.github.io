name: Archive kicker light v12

on:
  push:
    paths:
      - 'scripts/archive-kicker-light-v12.py'
      - '.github/workflows/archive-kicker-light-v12.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply archive kicker light fix
        run: python scripts/archive-kicker-light-v12.py
      - name: Commit changes and remove temporary files
        run: |
          rm scripts/archive-kicker-light-v12.py
          rm .github/workflows/archive-kicker-light-v12.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove archive kicker gradient in light theme [skip ci]'
          git push origin main
