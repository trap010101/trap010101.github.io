name: Import user poster replacements 2026-09-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-user-posters-20260907.yml'

permissions:
  contents: write

jobs:
  import-posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download replacement posters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/posters

          curl -fL --retry 3 \
            -A 'Mozilla/5.0' \
            'https://pbs.twimg.com/media/HMVa5NebEAAUsnh.jpg?format=jpg&name=orig' \
            -o 'assets/posters/the-guy-she-was-interested-in-wasnt-a-guy-at-all-user-20260907-r3.jpg'

          curl -fL --retry 3 \
            -A 'Mozilla/5.0' \
            'https://www.animeclick.it/immagini/anime/Tensei_Goblin_dakedo_Shitsumon_Aru/cover/Tensei_Goblin_dakedo_Shitsumon_Aru-cover.jpg' \
            -o 'assets/posters/im-a-reincarnated-goblin-any-questions-user-20260907-r3.jpg'

          file assets/posters/*-user-20260907-r3.jpg
          test -s 'assets/posters/the-guy-she-was-interested-in-wasnt-a-guy-at-all-user-20260907-r3.jpg'
          test -s 'assets/posters/im-a-reincarnated-goblin-any-questions-user-20260907-r3.jpg'

      - name: Commit poster assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'assets/posters/the-guy-she-was-interested-in-wasnt-a-guy-at-all-user-20260907-r3.jpg' \
            'assets/posters/im-a-reincarnated-goblin-any-questions-user-20260907-r3.jpg'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Import user-provided poster replacements [skip ci]'
          git push
