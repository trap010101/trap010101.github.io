name: Light logo and gradient hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/light-logo-gradient-hotfix.yml"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch light logo and gradients
        run: python scripts/light-logo-gradient-hotfix.py

      - name: Validate JavaScript
        run: |
          node --check theme.js
          node --check language-switcher-compact.js
          node --check secondary-header.js

      - name: Commit hotfix and remove temporary files
        run: |
          rm .github/workflows/light-logo-gradient-hotfix.yml scripts/light-logo-gradient-hotfix.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use light theme logo and refresh gradients [skip ci]"
          git push
