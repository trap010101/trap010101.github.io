name: Update branding copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-branding-copy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update header and footer copy
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_header = '<div class="eyebrow">Anime Schedule · 2026–2027</div>'
          new_header = '<div class="brand-slot" aria-hidden="true"></div>'
          if old_header not in text:
              raise SystemExit('Header schedule label not found')
          text = text.replace(old_header, new_header, 1)

          old_footer = '<footer>\n  2026–2027 Anime Schedule<br>\n  문의: <a href="mailto:admin@newani.me">admin@newani.me</a>\n</footer>'
          new_footer = '<footer>\n  <div>방영 예정 애니메이션과 극장판의 일정, PV, 공식 사이트, 스트리밍 정보를 한눈에 정리합니다.</div>\n  <div>© 2026 NewAnime</div>\n</footer>'
          if old_footer not in text:
              raise SystemExit('Existing footer copy not found')
          text = text.replace(old_footer, new_footer, 1)

          path.write_text(text, encoding='utf-8')
          PY

          grep -Fq 'class="brand-slot"' index.html
          ! grep -Fq 'Anime Schedule · 2026–2027' index.html
          ! grep -Fq '2026–2027 Anime Schedule' index.html
          grep -Fq '© 2026 NewAnime' index.html

      - name: Remove one-off workflow and commit
        run: |
          set -euxo pipefail
          rm .github/workflows/update-branding-copy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/update-branding-copy.yml
          git commit -m 'Update NewAnime header and footer copy'
          git push origin HEAD:main
