name: Optimize poster loading order

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-poster-loading-20260912.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply poster loading patch
        run: python3 scripts/optimize-poster-loading-20260912.py

      - name: Validate JavaScript and patch shape
        run: |
          set -euo pipefail
          node --check app.js
          node --check upcoming-carousel.js
          grep -Fq 'window.NewAnimePosterLoader = posterLoader' app.js
          grep -Fq 'data-poster-src="${anime.poster.src}"' app.js
          grep -Fq 'initPosterLoading();' app.js
          grep -Fq 'requestCardPoster(card, "high")' upcoming-carousel.js
          grep -Fq 'app.js?v=20260912-posterload1' index.html
          grep -Fq 'upcoming-carousel.js?v=20260912-posterload1' index.html
          ! grep -Fq 'img.src = entry.anime.poster.src' upcoming-carousel.js

      - name: Run focused schedule tests
        run: |
          set -euo pipefail
          if [ -f tests/schedule-utils.test.js ]; then node --test tests/schedule-utils.test.js; fi

      - name: Remove temporary files and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/optimize-poster-loading-20260912.yml
          rm -f scripts/optimize-poster-loading-20260912.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prioritize poster loading by viewport [skip ci]'
          git push origin HEAD:main
