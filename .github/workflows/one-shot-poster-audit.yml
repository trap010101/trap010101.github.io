name: One-shot official poster audit

on:
  push:
    paths:
      - '.github/workflows/one-shot-poster-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - name: Audit poster sources against official sites
        run: |
          cat > /tmp/audit.py <<'PY'
          import io, json, re, math, os, subprocess
          from urllib.parse import urljoin, urlparse
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          text = open('index.html', encoding='utf-8').read()
          UA = {'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}
          sess = requests.Session(); sess.headers.update(UA)

          def obj_block(start_marker, end_marker=None):
              s = text.find(start_marker)
              if s < 0: return ''
              if end_marker:
                  e = text.find(end_marker, s)
              else:
                  e = text.find('\n};', s)
              return text[s:e if e >= 0 else len(text)]

          posters = {}
          block = obj_block('const posterLinks = {')
          for title, url in re.findall(r'^\s*"([^"]+)"\s*:\s*"([^"]+)"\s*,?\s*$', block, re.M):
              posters[title] = url
          for ob in re.findall(r'Object\.assign\(posterLinks,\s*\{(.*?)\}\);', text, re.S):
              for title, url in re.findall(r'^\s*"([^"]+)"\s*:\s*"([^"]+)"\s*,?\s*$', ob, re.M):
                  posters[title] = url

          resources = obj_block('const resourceLinks = {', 'const ottPlatforms')
          officials = {}
          for m in re.finditer(r'^\s*"([^"]+)"\s*:\s*\{(.*?)^\s*\},?\s*$', resources, re.M|re.S):
              title, body = m.group(1), m.group(2)
              om = re.search(r'"official"\s*:\s*(?:"([^"]+)"|null)', body)
              if om and om.group(1): officials[title] = om.group(1)

          def fetch_bytes(url, limit=12_000_000):
              try:
                  r = sess.get(url, timeout=15, allow_redirects=True)
                  r.raise_for_status()
                  b = r.content
                  if len(b) > limit: return None, r.url, 'too-large'
                  return b, r.url, None
              except Exception as e:
                  return None, url, type(e).__name__

          def image_info(url):
              b, final, err = fetch_bytes(url)
              if not b: return {'url':url,'final':final,'error':err}
              try:
                  im = Image.open(io.BytesIO(b)); w,h=im.size
                  return {'url':url,'final':final,'w':w,'h':h,'ratio':round(w/h,4),'format':im.format}
              except Exception as e:
                  return {'url':url,'final':final,'error':'not-image'}

          titles = sorted(set(officials) | set(posters))
          old_infos = {}
          with ThreadPoolExecutor(max_workers=16) as ex:
              futs = {ex.submit(image_info, posters[t]): t for t in titles if t in posters}
              for f in as_completed(futs): old_infos[futs[f]] = f.result()

          def is_problem(title):
              if title not in posters: return True
              inf = old_infos.get(title,{})
              r = inf.get('ratio')
              if not r: return True
              return r > 0.84 or r < 0.42

          img_ext = re.compile(r'(?i)(?:https?:)?[^\"\'\s)>]+\.(?:jpe?g|png|webp|avif)(?:\?[^\"\'\s)>]*)?')
          rel_ext = re.compile(r'(?i)[\"\']([^\"\']+\.(?:jpe?g|png|webp|avif)(?:\?[^\"\']*)?)[\"\']')
          css_url = re.compile(r'url\((?:[\"\']?)([^)\"\']+\.(?:jpe?g|png|webp|avif)(?:\?[^)\"\']*)?)(?:[\"\']?)\)', re.I)

          def path_bonus(url):
              s=url.lower()
              score=0
              if re.search(r'(^|[/_\-])(kv|keyvisual|key_visual|mainvisual|main_visual|visual|teaser)([/_.\-]|$)',s): score += 45
              if re.search(r'(^|[/_\-])(sp|vertical|portrait)([/_.\-]|$)',s): score += 18
              if re.search(r'(^|[/_\-])(top|home)([/_.\-]|$)',s): score += 6
              if re.search(r'logo|icon|bnr|banner|button|favicon|thumb|thumbnail|ogp|sns|twitter|lineup|news|staff|cast|goods',s): score -= 80
              return score

          def candidate_score(info):
              if info.get('error') or not info.get('ratio'): return -999
              w,h,r=info['w'],info['h'],info['ratio']
              if h <= w or r < 0.43 or r > 0.82 or w < 280 or h < 480: return -500
              score = 110 - abs(r-(2/3))*150 + path_bonus(info['url'])
              score += min(20, math.log10(max(1,w*h))*3)
              return round(score,2)

          def scrape_candidates(title, official):
              if official.startswith(('https://x.com/','https://twitter.com/')): return {'error':'social-only','candidates':[]}
              b, final, err = fetch_bytes(official, 5_000_000)
              if not b: return {'error':err,'candidates':[]}
              try: html=b.decode('utf-8','ignore')
              except: return {'error':'decode','candidates':[]}
              soup=BeautifulSoup(html,'html.parser')
              urls=set()
              for tag in soup.find_all(['img','source']):
                  for a in ['src','data-src','data-original','data-lazy-src','srcset','data-srcset']:
                      v=tag.get(a)
                      if not v: continue
                      for part in v.split(','):
                          u=part.strip().split(' ')[0]
                          if u: urls.add(urljoin(final,u))
              for tag in soup.find_all('meta'):
                  key=(tag.get('property') or tag.get('name') or '').lower()
                  if key in ('og:image','twitter:image','twitter:image:src') and tag.get('content'):
                      urls.add(urljoin(final,tag['content']))
              for u in css_url.findall(html): urls.add(urljoin(final,u))
              for u in rel_ext.findall(html): urls.add(urljoin(final,u))

              assets=[]
              for tag in soup.find_all(['link','script']):
                  u=tag.get('href') if tag.name=='link' else tag.get('src')
                  if not u: continue
                  full=urljoin(final,u)
                  if tag.name=='link' and 'stylesheet' in (tag.get('rel') or []): assets.append(('css',full))
                  elif tag.name=='script' and full.endswith(('.js','.mjs')): assets.append(('js',full))
              assets=assets[:20]
              def fetch_asset(item):
                  kind,u=item
                  bb,ff,ee=fetch_bytes(u,2_500_000)
                  return kind,ff,bb.decode('utf-8','ignore') if bb else ''
              with ThreadPoolExecutor(max_workers=8) as ex:
                  for kind, af, atxt in ex.map(fetch_asset,assets):
                      if not atxt: continue
                      for u in css_url.findall(atxt): urls.add(urljoin(af,u))
                      for u in rel_ext.findall(atxt): urls.add(urljoin(af,u))

              urls={u for u in urls if u.startswith(('http://','https://')) and not u.startswith('data:')}
              pre=sorted(urls,key=lambda u:path_bonus(u),reverse=True)[:70]
              infos=[]
              with ThreadPoolExecutor(max_workers=14) as ex:
                  futs={ex.submit(image_info,u):u for u in pre}
                  for f in as_completed(futs):
                      inf=f.result(); inf['score']=candidate_score(inf)
                      if inf['score']>-500: infos.append(inf)
              infos.sort(key=lambda x:x['score'],reverse=True)
              return {'official_final':final,'candidates':infos[:5]}

          problems=[t for t in titles if is_problem(t) and t in officials]
          results={}
          with ThreadPoolExecutor(max_workers=8) as ex:
              futs={ex.submit(scrape_candidates,t,officials[t]):t for t in problems}
              for f in as_completed(futs):
                  t=futs[f]
                  try: results[t]=f.result()
                  except Exception as e: results[t]={'error':repr(e),'candidates':[]}

          report={
              'summary':{'poster_count':len(posters),'official_count':len(officials),'problem_count':len(problems)},
              'items':[]
          }
          for t in problems:
              report['items'].append({
                  'title':t,'official':officials.get(t),'current':posters.get(t),'current_info':old_infos.get(t),
                  **results.get(t,{'candidates':[]})
              })
          open('.poster-audit.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report['summary'],ensure_ascii=False))
          PY
          python /tmp/audit.py
      - name: Commit audit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .poster-audit.json
          git commit -m "Generate official poster audit report" || exit 0
          git push origin main
