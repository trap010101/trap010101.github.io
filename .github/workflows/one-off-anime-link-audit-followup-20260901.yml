name: One-off anime link audit follow-up 2026-09-01

on:
  push:
    paths:
      - .github/workflows/one-off-anime-link-audit-followup-20260901.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch remaining audited links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          pv_updates = [
              ("ヤマトよ永遠に REBEL3199 第七章 虹色の輪廻", "https://youtu.be/IUVGkkB8SNI"),
              ("機動警察パトレイバー EZY File 3", "https://www.youtube.com/watch?v=rpxVx91mTPA"),
              ("ONE PIECE FILM GOD VALLEY", "https://www.youtube.com/watch?v=E3Zk2270um8"),
              ("海が走るエンドロール", "https://youtu.be/9Nuwm1vjO_o"),
              ("이세계 전생 소동기", "https://www.youtube.com/watch?v=G7ddo_2gKXE"),
              ("옆자리 아랴 양 2기", "https://www.youtube.com/watch?v=xY68LJp3lm8"),
              ("도원암귀 닛코·게곤 폭포편", "https://www.youtube.com/watch?v=DygVpkacKqQ"),
              ("게임세계전생〈던활〉", "https://www.youtube.com/watch?v=4BFObPUXf2E"),
          ]

          pv_count = 0
          for fragment, url in pv_updates:
              pattern = re.compile(r'("[^"]*' + re.escape(fragment) + r'[^"]*"\s*:\s*\{\s*"pv"\s*:\s*)null')
              text, count = pattern.subn(
                  lambda match: match.group(1) + json.dumps(url, ensure_ascii=False),
                  text,
                  count=1,
              )
              print(f"PV {fragment}: {count}")
              pv_count += count

          start_marker = "// BEGIN LINK AUDIT 2026-09-01"
          end_marker = "// END LINK AUDIT 2026-09-01"
          if start_marker in text and end_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start) + len(end_marker)
              text = text[:start] + text[end:]

          resource_part = text.split("const ottPlatforms =", 1)[0]
          streaming_updates = [
              ("FX戦士くるみちゃん", {"officialstream": "https://fxkurumi-info.com/onair/"}),
              ("バーテックスフォース", {"officialstream": "https://vertexforce.jp/onair/"}),
              ("Duel Masters LOST", {"officialstream": "https://www.shopro.co.jp/anime/duelmasters_lost/"}),
              ("잡용부여술사", {"officialstream": "https://zatsuyofuyo-pr.com/"}),
              ("DEATH STRANDING ISOLATIONS", {"disney": "https://www.disneyplus.com/ja-jp/explore/articles/death_stranding_isolations_1113"}),
              ("dreamland", {"officialstream": "https://www.crunchyroll.com/de/news/latest/2026/8/28/dreamland-release-date-trailer-japanische-synchro"}),
              ("朱色の仮面", {"officialstream": "https://www.crunchyroll.com/news/latest/2026/7/3/the-vermilion-mask-anime-trailer-2"}),
              ("PSYREN", {"officialstream": "https://www.crunchyroll.com/pl/news/announcements/2026/7/12/psyren-the-eternal-fools-words-of-wisdom-dreamland-musketeer-nanako-stream-crunchyroll"}),
          ]

          resolved_streaming = {}
          for fragment, links in streaming_updates:
              match = re.search(
                  r'"([^"]*' + re.escape(fragment) + r'[^"]*)"\s*:\s*\{\s*"pv"',
                  resource_part,
              )
              if match:
                  resolved_streaming[match.group(1)] = links
                  print(f"OTT {fragment}: {match.group(1)} -> {links}")
              else:
                  print(f"OTT MISS {fragment}")

          block = "\n".join([
              start_marker,
              'if (!ottPlatforms.some((platform) => platform.id === "officialstream")) {',
              '  ottPlatforms.push({ id: "officialstream", name: "공식 배급 안내" });',
              '}',
              'const auditedOttLinks20260901 = ' + json.dumps(resolved_streaming, ensure_ascii=False, indent=2) + ';',
              'for (const [title, links] of Object.entries(auditedOttLinks20260901)) {',
              '  ottLinks[title] = Object.assign({}, ottLinks[title] || {}, links);',
              '}',
              end_marker,
          ])

          marker = "const titleLocales = {"
          if marker not in text:
              raise SystemExit("titleLocales marker missing")
          text = text.replace(marker, block + "\n\n" + marker, 1)
          path.write_text(text, encoding="utf-8")

          print(f"PV_COUNT={pv_count}")
          print(f"OTT_COUNT={len(resolved_streaming)}")
          PY

      - name: Commit follow-up link audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes"
          else
            git commit -m "Add remaining PV and streaming links"
            git push
          fi
