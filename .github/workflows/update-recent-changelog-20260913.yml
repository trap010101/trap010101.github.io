name: Update recent NewAnime changelog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-recent-changelog-20260913.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh recent updates page
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          from collections import Counter

          path = Path('updates/index.html')
          text = path.read_text(encoding='utf-8')

          if 'date-2026-09-12' in text:
              raise SystemExit('2026-09-12 changelog already exists; refusing duplicate insertion')

          marker = '        <section class="changelog-day" aria-labelledby="date-2026-09-09">'
          if marker not in text:
              raise SystemExit('Could not find 2026-09-09 insertion point')

          sections = '\n'.join([
              '        <section class="changelog-day" aria-labelledby="date-2026-09-12">',
              '          <div class="changelog-day-header"><h2 id="date-2026-09-12"><time datetime="2026-09-12">2026.09.12</time></h2></div>',
              '          <div class="changelog-groups">',
              '            <section class="changelog-group" aria-labelledby="group-2026-09-12-performance">',
              '              <h3 id="group-2026-09-12-performance">성능·로딩</h3>',
              '              <ul class="changelog-entries">',
              '                <li class="changelog-entry" id="2026-09-12-homepage-loading-and-poster-optimization">',
              '                  <strong class="changelog-entry-title">메인 화면 로딩·포스터 최적화</strong>',
              '                  <p>첫 화면 렌더링과 스크립트 로딩 순서를 정리하고, 큰 포스터 WebP 자산을 다시 최적화했습니다. 화면에 가까운 포스터를 우선 불러오도록 개선해 메인 화면에서 작품 목록을 더 빠르게 확인할 수 있도록 했습니다.</p>',
              '                </li>',
              '              </ul>',
              '            </section>',
              '            <section class="changelog-group" aria-labelledby="group-2026-09-12-search">',
              '              <h3 id="group-2026-09-12-search">검색·서비스 안내</h3>',
              '              <ul class="changelog-entries">',
              '                <li class="changelog-entry" id="2026-09-12-search-identity-and-service-scope">',
              '                  <strong class="changelog-entry-title">검색 노출 정보·서비스 범위 명확화</strong>',
              '                  <p>검색 결과에서 NewAnime이 방영 예정 애니메이션 정보와 공식 시청 경로를 안내하는 서비스라는 점이 명확하게 전달되도록 메타데이터와 소개 문구를 정비했습니다. 메인 화면에도 서비스 범위를 알기 쉽게 안내하는 문구를 추가했습니다.</p>',
              '                </li>',
              '              </ul>',
              '            </section>',
              '            <section class="changelog-group" aria-labelledby="group-2026-09-12-content">',
              '              <h3 id="group-2026-09-12-content">작품 정보</h3>',
              '              <ul class="changelog-entries">',
              '                <li class="changelog-entry" id="2026-09-12-title-and-poster-corrections">',
              '                  <strong class="changelog-entry-title">한국어 작품명·포스터 추가 정비</strong>',
              '                  <p>최근 등록 작품을 다시 검수해 여러 한국어 작품명을 바로잡고, 누락되거나 잘못 연결된 포스터를 교체했습니다. 포스터 비율과 썸네일 크롭도 함께 조정해 목록과 상세 화면의 표시를 안정화했습니다.</p>',
              '                </li>',
              '              </ul>',
              '            </section>',
              '          </div>',
              '        </section>',
              '',
              '        <section class="changelog-day" aria-labelledby="date-2026-09-11">',
              '          <div class="changelog-day-header"><h2 id="date-2026-09-11"><time datetime="2026-09-11">2026.09.11</time></h2></div>',
              '          <div class="changelog-groups">',
              '            <section class="changelog-group" aria-labelledby="group-2026-09-11-theme">',
              '              <h3 id="group-2026-09-11-theme">테마·UI</h3>',
              '              <ul class="changelog-entries">',
              '                <li class="changelog-entry" id="2026-09-11-light-theme-and-system-scheme">',
              '                  <strong class="changelog-entry-title">라이트 테마·기기 테마 연동</strong>',
              '                  <p>라이트 테마를 추가하고 기본 화면 모드가 기기의 밝기 설정을 따르도록 개선했습니다. 팝업, 공지, 보조 페이지의 제목과 세부 요소도 밝은 화면에서 자연스럽게 보이도록 조정했습니다.</p>',
              '                </li>',
              '              </ul>',
              '            </section>',
              '            <section class="changelog-group" aria-labelledby="group-2026-09-11-wishlist">',
              '              <h3 id="group-2026-09-11-wishlist">위시리스트</h3>',
              '              <ul class="changelog-entries">',
              '                <li class="changelog-entry" id="2026-09-11-wishlist-display-cleanup">',
              '                  <strong class="changelog-entry-title">위시리스트 표시 개선</strong>',
              '                  <p>찜 목록에서 누락되던 포스터를 복구하고 라벨과 안내 배지 표시를 정리해 저장한 작품 정보를 더 정확하게 확인할 수 있도록 개선했습니다.</p>',
              '                </li>',
              '                <li class="changelog-entry" id="2026-09-11-popularity-ranking-temporarily-hidden">',
              '                  <strong class="changelog-entry-title">인기 랭킹 임시 비노출</strong>',
              '                  <p>아직 위시리스트 집계량이 충분하지 않은 인기 랭킹은 의미 있는 데이터가 쌓일 때까지 화면에서 숨기고 관련 안내를 정리했습니다.</p>',
              '                </li>',
              '              </ul>',
              '            </section>',
              '          </div>',
              '        </section>',
              '',
              '        <section class="changelog-day" aria-labelledby="date-2026-09-10">',
              '          <div class="changelog-day-header"><h2 id="date-2026-09-10"><time datetime="2026-09-10">2026.09.10</time></h2></div>',
              '          <div class="changelog-groups">',
              '            <section class="changelog-group" aria-labelledby="group-2026-09-10-navigation">',
              '              <h3 id="group-2026-09-10-navigation">메뉴·브랜딩</h3>',
              '              <ul class="changelog-entries">',
              '                <li class="changelog-entry" id="2026-09-10-shared-menu-and-branding">',
              '                  <strong class="changelog-entry-title">공통 메뉴 순서·브랜딩 통일</strong>',
              '                  <p>메인과 보조 페이지의 햄버거 메뉴 순서를 동일하게 맞추고, 이벤트 등 하위 페이지의 상단 브랜딩 표현도 newani.me 기준으로 통일해 페이지 사이의 탐색 경험을 정리했습니다.</p>',
              '                </li>',
              '              </ul>',
              '            </section>',
              '          </div>',
              '        </section>',
              '',
          ]) + '\n'

          text = text.replace(marker, sections + marker, 1)

          script_pattern = re.compile(
              r'(<script type="application/ld\+json" id="updatesStructuredData">\s*)(\{.*?\})(\s*</script>)',
              re.S,
          )
          match = script_pattern.search(text)
          if not match:
              raise SystemExit('Could not find updates structured data')

          data = json.loads(match.group(2))
          old_items = data['mainEntity']['itemListElement']
          new_entries = [
              ('메인 화면 로딩·포스터 최적화', '첫 화면 렌더링과 스크립트 로딩 순서를 정리하고, 큰 포스터 WebP 자산을 다시 최적화했습니다. 화면에 가까운 포스터를 우선 불러오도록 개선해 메인 화면에서 작품 목록을 더 빠르게 확인할 수 있도록 했습니다.', '2026-09-12-homepage-loading-and-poster-optimization'),
              ('검색 노출 정보·서비스 범위 명확화', '검색 결과에서 NewAnime이 방영 예정 애니메이션 정보와 공식 시청 경로를 안내하는 서비스라는 점이 명확하게 전달되도록 메타데이터와 소개 문구를 정비했습니다. 메인 화면에도 서비스 범위를 알기 쉽게 안내하는 문구를 추가했습니다.', '2026-09-12-search-identity-and-service-scope'),
              ('한국어 작품명·포스터 추가 정비', '최근 등록 작품을 다시 검수해 여러 한국어 작품명을 바로잡고, 누락되거나 잘못 연결된 포스터를 교체했습니다. 포스터 비율과 썸네일 크롭도 함께 조정해 목록과 상세 화면의 표시를 안정화했습니다.', '2026-09-12-title-and-poster-corrections'),
              ('라이트 테마·기기 테마 연동', '라이트 테마를 추가하고 기본 화면 모드가 기기의 밝기 설정을 따르도록 개선했습니다. 팝업, 공지, 보조 페이지의 제목과 세부 요소도 밝은 화면에서 자연스럽게 보이도록 조정했습니다.', '2026-09-11-light-theme-and-system-scheme'),
              ('위시리스트 표시 개선', '찜 목록에서 누락되던 포스터를 복구하고 라벨과 안내 배지 표시를 정리해 저장한 작품 정보를 더 정확하게 확인할 수 있도록 개선했습니다.', '2026-09-11-wishlist-display-cleanup'),
              ('인기 랭킹 임시 비노출', '아직 위시리스트 집계량이 충분하지 않은 인기 랭킹은 의미 있는 데이터가 쌓일 때까지 화면에서 숨기고 관련 안내를 정리했습니다.', '2026-09-11-popularity-ranking-temporarily-hidden'),
              ('공통 메뉴 순서·브랜딩 통일', '메인과 보조 페이지의 햄버거 메뉴 순서를 동일하게 맞추고, 이벤트 등 하위 페이지의 상단 브랜딩 표현도 newani.me 기준으로 통일해 페이지 사이의 탐색 경험을 정리했습니다.', '2026-09-10-shared-menu-and-branding'),
          ]

          new_items = []
          for name, description, anchor in new_entries:
              new_items.append({
                  '@type': 'ListItem',
                  'position': 0,
                  'item': {
                      '@type': 'Thing',
                      'name': name,
                      'description': description,
                      'url': f'https://newani.me/updates/?lang=ko#{anchor}',
                  },
              })

          items = new_items + old_items
          for position, item in enumerate(items, 1):
              item['position'] = position

          data['dateModified'] = '2026-09-12'
          data['mainEntity']['numberOfItems'] = len(items)
          data['mainEntity']['itemListElement'] = items
          payload = json.dumps(data, ensure_ascii=False, separators=(',', ':'))
          text = text[:match.start(2)] + payload + text[match.end(2):]

          ids = re.findall(r'\bid="([^"]+)"', text)
          duplicates = [key for key, count in Counter(ids).items() if count > 1]
          if duplicates:
              raise SystemExit(f'Duplicate HTML ids after patch: {duplicates[:10]}')
          if data['mainEntity']['numberOfItems'] != 59:
              raise SystemExit(f'Unexpected structured data count: {data["mainEntity"]["numberOfItems"]}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate refreshed changelog
        run: |
          set -euo pipefail
          grep -Fq 'dateModified":"2026-09-12"' updates/index.html
          grep -Fq 'numberOfItems":59' updates/index.html
          grep -Fq 'id="date-2026-09-12"' updates/index.html
          grep -Fq 'id="date-2026-09-11"' updates/index.html
          grep -Fq 'id="date-2026-09-10"' updates/index.html
          grep -Fq '메인 화면 로딩·포스터 최적화' updates/index.html
          grep -Fq '라이트 테마·기기 테마 연동' updates/index.html
          grep -Fq '공통 메뉴 순서·브랜딩 통일' updates/index.html

      - name: Commit changelog and clean workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-recent-changelog-20260913.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/index.html .github/workflows/update-recent-changelog-20260913.yml
          git commit -m 'Update recent changelog through September 12 [skip ci]'
          git push origin main
