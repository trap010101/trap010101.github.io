name: Fix God Valley official X poster

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-godvalley-official-x-poster.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact official X announcement image
        run: |
          set -euxo pipefail
          mkdir -p assets/posters
          curl -L --fail --retry 3 \
            -A 'Mozilla/5.0' \
            'https://pbs.twimg.com/media/HQZb8zFbsAAmLGh.jpg?name=orig' \
            -o /tmp/godvalley-announcement.jpg
          test -s /tmp/godvalley-announcement.jpg

      - name: Extract God Valley panel and fit poster frame without clipping
        run: |
          set -euxo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from statistics import median

          src = Image.open('/tmp/godvalley-announcement.jpg').convert('RGB')
          w, h = src.size
          print(f'Official X composite: {w}x{h}')
          if (w, h) != (1168, 660):
              raise SystemExit(f'Unexpected official X image size: {w}x{h}')

          # Official announcement graphic places GOD VALLEY on the left and BAAD on the right.
          panel = src.crop((0, 0, w // 2, h))
          pw, ph = panel.size

          # Site poster cards are 2:3 with object-fit: cover. Preserve the entire official
          # GOD VALLEY panel and add only background-colored vertical padding so no title text clips.
          target_h = round(pw * 3 / 2)
          if target_h < ph:
              raise SystemExit('Panel unexpectedly taller than target poster ratio')

          corners = [panel.getpixel((0,0)), panel.getpixel((pw-1,0)), panel.getpixel((0,ph-1)), panel.getpixel((pw-1,ph-1))]
          bg = tuple(int(median([c[i] for c in corners])) for i in range(3))
          out = Image.new('RGB', (pw, target_h), bg)
          y = (target_h - ph) // 2
          out.paste(panel, (0, y))
          print(f'God Valley poster: {out.width}x{out.height}; padding={y}px; bg={bg}')
          out.save('assets/posters/one-piece-film-god-valley.webp', 'WEBP', quality=95, method=6)
          PY

      - name: Remove one-off workflow and commit
        run: |
          set -euxo pipefail
          rm .github/workflows/fix-godvalley-official-x-poster.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/posters/one-piece-film-god-valley.webp .github/workflows/fix-godvalley-official-x-poster.yml
          git commit -m 'fix: use official God Valley X announcement visual'
          git push origin HEAD:main
