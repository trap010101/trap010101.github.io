name: Localize anime poster assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-anime-posters.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official poster assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/posters
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://ansatsu-kizoku.jp/wp-content/uploads/2026/04/img.png' \
            -o assets/posters/worlds-finest-assassin-s2.png
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://www.bn-pictures.co.jp/keroro-anime/tv/images/KV/KV.webp' \
            -o assets/posters/keroro-gunso-star.webp

      - name: Switch poster mappings to local assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data/anime-20260904.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'src: "https://ansatsu-kizoku.jp/wp-content/uploads/2026/04/img.png"',
              'src: "assets/posters/worlds-finest-assassin-s2.png"'
          )
          s = s.replace(
              'src: "https://www.bn-pictures.co.jp/keroro-anime/tv/images/KV/KV.webp"',
              'src: "assets/posters/keroro-gunso-star.webp"'
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit localized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/posters/worlds-finest-assassin-s2.png \
                  assets/posters/keroro-gunso-star.webp \
                  data/anime-20260904.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Localize Keroro and Assassin Season 2 posters'
          git push origin HEAD:main
