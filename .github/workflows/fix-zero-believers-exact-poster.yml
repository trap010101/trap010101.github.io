name: Fix exact Zero Believers poster

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-zero-believers-exact-poster.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact uploaded WebP asset
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from PIL import Image

          path = Path('assets/posters/zero-believers-goddess-isekai-strategy-user-20260912-r2.webp')
          raw = path.read_bytes()
          digest = sha256(raw).hexdigest()
          print('sha256=', digest)
          if digest != '62f2e3eb0c90b1c5eecffaddd5c1b89aba468e98f46ce9edcab27c3d6ddfff2b':
              raise SystemExit('Exact uploaded poster WebP hash mismatch')
          with Image.open(path) as image:
              print('format=', image.format, 'size=', image.size)
              if image.format != 'WEBP' or image.size != (1086, 1536):
                  raise SystemExit('Unexpected poster format or dimensions')
          PY

      - name: Replace poster references and bust focused caches
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          OLD = 'zero-believers-goddess-isekai-strategy-user-20260912.webp'
          NEW = 'zero-believers-goddess-isekai-strategy-user-20260912-r2.webp'
          replacements = {
              OLD: NEW,
              'data/anime-20260904.js?v=20260912-zero1': 'data/anime-20260904.js?v=20260912-zero2',
              '/data/anime-20260904.js?v=20260912-zero1': '/data/anime-20260904.js?v=20260912-zero2',
              'data/poster-fixes-20260905.js?v=20260912-zero1': 'data/poster-fixes-20260905.js?v=20260912-zero2',
              '/data/poster-fixes-20260905.js?v=20260912-zero1': '/data/poster-fixes-20260905.js?v=20260912-zero2',
          }
          text_exts = {'.html', '.js', '.json', '.xml', '.md'}
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  current = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = current
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != current:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('changed files:')
          for path in changed:
              print(' -', path)
          PY

      - name: Remove incorrect substituted poster
        run: rm -f assets/posters/zero-believers-goddess-isekai-strategy-user-20260912.webp

      - name: Validate JavaScript and requested result
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            node --check "$file"
          done < <(git diff --name-only -- '*.js')
          grep -Fq 'ko: "신자 0명 여신님과 시작하는 이세계 공략"' data/anime-20260904.js
          grep -Fq 'zero-believers-goddess-isekai-strategy-user-20260912-r2.webp' data/anime-20260904.js
          grep -Fq 'zero-believers-goddess-isekai-strategy-user-20260912-r2.webp' data/poster-fixes-20260905.js
          grep -Fq '신자 0명 여신님과 시작하는 이세계 공략' anime/zero-believers-goddess-isekai-strategy/index.html
          grep -Fq 'zero-believers-goddess-isekai-strategy-user-20260912-r2.webp' anime/zero-believers-goddess-isekai-strategy/index.html
          test ! -e assets/posters/zero-believers-goddess-isekai-strategy-user-20260912.webp
          ! grep -R -Fq --exclude-dir=.git --exclude='fix-zero-believers-exact-poster.yml' 'zero-believers-goddess-isekai-strategy-user-20260912.webp' .

      - name: Commit final patch and clean workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-zero-believers-exact-poster.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use exact uploaded Zero Believers poster [skip ci]'
          git push origin main
