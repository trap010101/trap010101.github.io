name: Apply requested poster replacements

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-zero-believers-exact-poster.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download, crop, and convert requested posters
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image

          OUT = Path('assets/posters')
          OUT.mkdir(parents=True, exist_ok=True)

          def fetch(url, referer):
              req = Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (NewAnime poster asset updater)',
                  'Referer': referer,
                  'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
              })
              with urlopen(req, timeout=60) as res:
                  return res.read()

          def crop_white_sides(image):
              rgb = image.convert('RGB')
              width, height = rgb.size
              px = rgb.load()

              def white_fraction(x):
                  white = 0
                  for y in range(height):
                      r, g, b = px[x, y]
                      if r >= 245 and g >= 245 and b >= 245:
                          white += 1
                  return white / height

              left = 0
              while left < width // 4 and white_fraction(left) >= 0.985:
                  left += 1
              right = width - 1
              while right > width * 3 // 4 and white_fraction(right) >= 0.985:
                  right -= 1

              if left or right < width - 1:
                  cropped = rgb.crop((left, 0, right + 1, height))
                  print(f'cropped white side margins: left={left}px right={width - 1 - right}px; {rgb.size} -> {cropped.size}')
                  return cropped
              print(f'no white side margin detected; preserving full artwork {rgb.size}')
              return rgb

          sources = [
              {
                  'url': 'https://yowaki-max-anime.com/assets/img/top/visual/visual.jpg',
                  'referer': 'https://yowaki-max-anime.com/',
                  'path': OUT / 'the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913.webp',
                  'crop_sides': True,
              },
              {
                  'url': 'https://prcdn.freetls.fastly.net/release_image/84062/151/84062-151-c7d563521b913888a46bf724c1c400d4-1909x2700.jpg',
                  'referer': 'https://prtimes.jp/',
                  'path': OUT / 'zero-believers-goddess-isekai-strategy-user-20260913.webp',
                  'crop_sides': False,
              },
          ]

          for item in sources:
              raw = fetch(item['url'], item['referer'])
              image = Image.open(BytesIO(raw)).convert('RGB')
              if item['crop_sides']:
                  image = crop_white_sides(image)
              if image.width < 600 or image.height < 800:
                  raise SystemExit(f"Unexpectedly small poster from {item['url']}: {image.size}")
              ratio = image.width / image.height
              if not (0.68 <= ratio <= 0.74):
                  raise SystemExit(f"Unexpected poster aspect ratio from {item['url']}: {image.size}")
              image.save(item['path'], 'WEBP', quality=92, method=6)
              check = Image.open(item['path'])
              print(item['path'], check.format, check.size, item['path'].stat().st_size)
          PY

      - name: Point anime data at the new local WebP assets
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('data/poster-fixes-20260905.js')
          text = path.read_text(encoding='utf-8')

          old_zero = '"zero-believers-goddess-isekai-strategy": { src: "assets/posters/zero-believers-goddess-isekai-strategy-user-20260912.webp", updatedAt: "2026-09-12" }'
          new_zero = '"zero-believers-goddess-isekai-strategy": { src: "assets/posters/zero-believers-goddess-isekai-strategy-user-20260913.webp", updatedAt: "2026-09-13" }'
          if old_zero not in text:
              raise SystemExit('Zero Believers poster reference pattern not found')
          text = text.replace(old_zero, new_zero)

          old_timid = 'src: "assets/posters/the-timid-max-lady-took-her-shrewd-fiance-s-bet-v2.webp",\n      updatedAt: "2026-09-12"'
          new_timid = 'src: "assets/posters/the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913.webp",\n      updatedAt: "2026-09-13"'
          if old_timid not in text:
              raise SystemExit('Timid MAX poster reference pattern not found')
          text = text.replace(old_timid, new_timid)
          text = text.replace('timidMax.updatedAt = "2026-09-12";', 'timidMax.updatedAt = "2026-09-13";')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Refresh cache and generated pages
        run: |
          set -euo pipefail
          node scripts/bump-poster-fix-cache.js
          node scripts/generate-anime-pages.js
          node scripts/enhance-anime-seo.js
          node scripts/enhance-streaming-regions.js
          node scripts/generate-schedule-pages.js
          node scripts/normalize-seo-defaults.js
          node scripts/inject-title-wrap-css.js

      - name: Validate requested result
        run: |
          set -euo pipefail
          node --check data/poster-fixes-20260905.js
          test -s assets/posters/the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913.webp
          test -s assets/posters/zero-believers-goddess-isekai-strategy-user-20260913.webp
          grep -Fq 'the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913.webp' data/poster-fixes-20260905.js
          grep -Fq 'zero-believers-goddess-isekai-strategy-user-20260913.webp' data/poster-fixes-20260905.js
          grep -Fq 'the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913.webp' anime/the-timid-max-lady-took-her-shrewd-fiance-s-bet/index.html
          grep -Fq 'zero-believers-goddess-isekai-strategy-user-20260913.webp' anime/zero-believers-goddess-isekai-strategy/index.html

      - name: Commit replacement assets and clean temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-zero-believers-exact-poster.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Replace Timid MAX and Zero Believers posters [skip ci]'
          git push origin main
