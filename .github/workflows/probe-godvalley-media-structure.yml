name: Probe God Valley media structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-godvalley-media-structure.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print FxTwitter media structure for official post
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json, requests
          u='https://api.fxtwitter.com/status/2091460365003739602'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=20)
          print('STATUS',r.status_code)
          data=r.json()
          tweet=data.get('tweet', data)
          print('TEXT:', tweet.get('text'))
          media=tweet.get('media')
          print('MEDIA_JSON:')
          print(json.dumps(media, ensure_ascii=False, indent=2))
          PY

      - name: Remove probe workflow
        run: |
          set -euxo pipefail
          rm .github/workflows/probe-godvalley-media-structure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/probe-godvalley-media-structure.yml
          git commit -m 'chore: remove God Valley media structure probe'
          git push origin HEAD:main
