name: Crop transparent logo bounds

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/crop-logo-bounds.yml"

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crop logo to visible pixels
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          python <<'PY'
          import re
          from pathlib import Path
          from PIL import Image

          logo_path = Path("assets/newanime-logo.webp")
          with Image.open(logo_path) as opened:
              image = opened.convert("RGBA")

          alpha = image.getchannel("A")
          visible = alpha.point(lambda value: 255 if value > 8 else 0)
          bounds = visible.getbbox()
          if not bounds:
              raise SystemExit("Logo has no visible pixels")

          padding = 4
          left = max(0, bounds[0] - padding)
          top = max(0, bounds[1] - padding)
          right = min(image.width, bounds[2] + padding)
          bottom = min(image.height, bounds[3] + padding)
          cropped = image.crop((left, top, right, bottom))
          cropped.save(logo_path, "WEBP", lossless=True, method=6, exact=True)

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")
          pattern = r'(<img class="brand-logo"[^>]*?)width="\d+" height="\d+"'
          replacement = rf'\1width="{cropped.width}" height="{cropped.height}"'
          html, count = re.subn(pattern, replacement, html, count=1)
          if count != 1:
              raise SystemExit(f"Expected one logo image, found {count}")
          index_path.write_text(html, encoding="utf-8")

          print(f"Original logo: {image.width}x{image.height}")
          print(f"Visible bounds: {bounds}")
          print(f"Cropped logo: {cropped.width}x{cropped.height}")
          PY

      - name: Validate and commit
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          with Image.open("assets/newanime-logo.webp") as image:
              if image.width >= 500 and image.height >= 167:
                  raise SystemExit(f"Logo was not cropped: {image.size}")
              if image.mode not in ("RGBA", "LA") and "transparency" not in image.info:
                  raise SystemExit("Logo alpha channel missing")
              print(f"Validated cropped logo: {image.size}")
          PY

          rm .github/workflows/crop-logo-bounds.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/newanime-logo.webp .github/workflows/crop-logo-bounds.yml
          git commit -m "Crop transparent logo bounds"
          git push origin HEAD:main
