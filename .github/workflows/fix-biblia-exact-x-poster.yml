name: Fix Biblia exact X poster

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-biblia-exact-x-poster.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact vertical teaser from official X post
        run: |
          set -euxo pipefail
          mkdir -p assets/posters
          if ! curl -L --fail --retry 3 \
            -A 'Mozilla/5.0' \
            'https://pbs.twimg.com/media/HGeJr-5aAAAALEk?format=jpg&name=orig' \
            -o /tmp/biblia-x.jpg; then
            curl -L --fail --retry 3 \
              -A 'Mozilla/5.0' \
              'https://pbs.twimg.com/media/HGeJr-5aAAAALEk?format=jpg&name=medium' \
              -o /tmp/biblia-x.jpg
          fi
          test -s /tmp/biblia-x.jpg

      - name: Validate portrait and convert without cropping
        run: |
          set -euxo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src = Image.open('/tmp/biblia-x.jpg').convert('RGB')
          w, h = src.size
          print(f'Biblia X attachment: {w}x{h}')
          if h <= w:
              raise SystemExit('Expected portrait image from the specified X post')
          src.save('assets/posters/biblia-bookstore.webp', 'WEBP', quality=95, method=6)
          PY

      - name: Remove one-off workflow and commit
        run: |
          set -euxo pipefail
          rm .github/workflows/fix-biblia-exact-x-poster.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/posters/biblia-bookstore.webp .github/workflows/fix-biblia-exact-x-poster.yml
          git commit -m 'fix: use exact vertical Biblia X teaser poster'
          git push origin HEAD:main
