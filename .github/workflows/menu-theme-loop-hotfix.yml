name: One-time hamburger menu hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/menu-theme-loop-hotfix.yml"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch theme observer loop and cache keys
        run: python scripts/menu-theme-loop-hotfix.py

      - name: Validate JavaScript
        run: |
          node --check theme.js
          node --check language-switcher-compact.js
          node --check secondary-header.js
          node --check app.js

      - name: Commit hotfix and remove temporary files
        run: |
          rm .github/workflows/menu-theme-loop-hotfix.yml scripts/menu-theme-loop-hotfix.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix hamburger menu theme observer loop [skip ci]"
          git push
