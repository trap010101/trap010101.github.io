name: Diagnose production runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-production-20260912.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check production resources
        run: |
          set -euo pipefail
          urls=(
            'https://newani.me/'
            'https://newani.me/anime/zero-believers-goddess-isekai-strategy/'
            'https://newani.me/event/'
            'https://newani.me/data/anime.js?v=20260912-zero1'
            'https://newani.me/data/anime-20260904.js?v=20260912-zero1'
            'https://newani.me/data/title-fixes-20260905.js?v=20260912-zero1'
            'https://newani.me/data/title-hotfix-20260909.js?v=20260912-zero1'
            'https://newani.me/data/poster-fixes-20260905.js?v=20260912-zero1'
            'https://newani.me/assets/posters/zero-believers-goddess-isekai-strategy-user-20260912.webp'
          )
          for url in "${urls[@]}"; do
            code=$(curl -L -sS -o /tmp/body -w '%{http_code}' "$url")
            size=$(wc -c < /tmp/body)
            echo "$code $size $url"
            test "$code" = 200
            test "$size" -gt 0
          done

      - name: Confirm production HTML and data
        run: |
          set -euo pipefail
          curl -LfsS 'https://newani.me/' -o /tmp/home.html
          curl -LfsS 'https://newani.me/anime/zero-believers-goddess-isekai-strategy/' -o /tmp/detail.html
          curl -LfsS 'https://newani.me/data/anime-20260904.js?v=20260912-zero1' -o /tmp/additions.js
          curl -LfsS 'https://newani.me/data/poster-fixes-20260905.js?v=20260912-zero1' -o /tmp/posters.js
          grep -F 'data/anime-20260904.js?v=20260912-zero1' /tmp/home.html
          grep -F '신자 0명 여신님과 시작하는 이세계 공략' /tmp/detail.html
          grep -F 'zero-believers-goddess-isekai-strategy-user-20260912.webp' /tmp/detail.html
          grep -F '신자 0명 여신님과 시작하는 이세계 공략' /tmp/additions.js
          grep -F 'zero-believers-goddess-isekai-strategy-user-20260912.webp' /tmp/additions.js
          grep -F 'zero-believers-goddess-isekai-strategy-user-20260912.webp' /tmp/posters.js

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Runtime browser smoke test
        run: |
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ locale: 'ko-KR' });
          const failures = [];
          const errors = [];
          const SITE_ORIGIN = 'https://newani.me';
          page.on('console', msg => {
            if (msg.type() === 'error') {
              const text = msg.text();
              if (text.includes('newani.me')) errors.push(`console: ${text}`);
            }
          });
          page.on('pageerror', err => errors.push(`pageerror: ${err.message}`));
          page.on('requestfailed', req => {
            try {
              if (new URL(req.url()).origin === SITE_ORIGIN) {
                failures.push(`${req.failure()?.errorText || 'failed'} ${req.url()}`);
              }
            } catch (_) {}
          });

          async function visit(url, label) {
            errors.length = 0;
            failures.length = 0;
            const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            console.log(`VISIT ${label} status=${response?.status()} url=${page.url()}`);
            await page.waitForTimeout(1200);
            console.log(`TITLE ${await page.title()}`);
            console.log(`ERRORS ${JSON.stringify(errors)}`);
            console.log(`FAILED ${JSON.stringify(failures)}`);
            if (!response || response.status() >= 400 || errors.length || failures.length) {
              throw new Error(`${label} runtime failure`);
            }
          }

          await visit('https://newani.me/?lang=ko&diag=20260912', 'home');
          const byText = page.getByText('신자 0명 여신님과 시작하는 이세계 공략', { exact: true }).first();
          console.log(`TARGET_TEXT_COUNT ${await byText.count()}`);
          if (!(await byText.count())) throw new Error('Target title is missing from the rendered homepage');
          const menu = page.locator('#menuToggle');
          await menu.click();
          console.log(`HOME_MENU_EXPANDED ${await menu.getAttribute('aria-expanded')}`);
          if ((await menu.getAttribute('aria-expanded')) !== 'true') throw new Error('Home hamburger did not open');

          await visit('https://newani.me/anime/zero-believers-goddess-isekai-strategy/?diag=20260912', 'detail');
          const detailH1 = (await page.locator('h1').first().innerText()).trim();
          const detailImg = await page.locator('.detail-poster').getAttribute('src');
          console.log(`DETAIL_H1 ${detailH1}`);
          console.log(`DETAIL_IMG ${detailImg}`);
          if (detailH1 !== '신자 0명 여신님과 시작하는 이세계 공략') throw new Error('Detail title mismatch');
          if (!detailImg?.includes('zero-believers-goddess-isekai-strategy-user-20260912.webp')) throw new Error('Detail poster mismatch');
          const detailMenu = page.locator('#menuToggle');
          await detailMenu.click();
          console.log(`DETAIL_MENU_EXPANDED ${await detailMenu.getAttribute('aria-expanded')}`);
          if ((await detailMenu.getAttribute('aria-expanded')) !== 'true') throw new Error('Detail hamburger did not open');

          await visit('https://newani.me/event/?lang=ko&diag=20260912', 'event');
          const eventMenu = page.locator('#menuToggle');
          await eventMenu.click();
          console.log(`EVENT_MENU_EXPANDED ${await eventMenu.getAttribute('aria-expanded')}`);
          if ((await eventMenu.getAttribute('aria-expanded')) !== 'true') throw new Error('Event hamburger did not open');
          const eventChildren = await page.locator('#eventList').locator(':scope > *').count();
          console.log(`EVENT_LIST_CHILDREN ${eventChildren}`);
          if (!eventChildren) throw new Error('Event list is empty after runtime load');

          await browser.close();
          JS
          node smoke.mjs
