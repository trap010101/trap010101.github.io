name: Fix secondary wishlist posters and info labels

on:
  push:
    branches:
      - main
    paths:
      - "scripts/fix-secondary-wishlist-info-labels.py"
      - ".github/workflows/fix-secondary-wishlist-info-labels.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused fixes
        run: python scripts/fix-secondary-wishlist-info-labels.py

      - name: Validate JavaScript
        run: |
          node --check wishlist.js
          node --check secondary-auth-bootstrap.js
          node --check info-page.js
          node --check scripts/generate-anime-pages.js
          node --check scripts/generate-schedule-pages.js

      - name: Verify requested labels
        run: |
          test "$(grep -o '<div class="hero-kicker">newani.me</div>' about/index.html | wc -l)" -eq 3
          test "$(grep -o '<div class="hero-kicker">newani.me</div>' privacy/index.html | wc -l)" -eq 3
          test "$(grep -o '<div class="hero-kicker">newani.me</div>' policy/index.html | wc -l)" -eq 3
          grep -q 'function posterSrc(anime)' wishlist.js
          grep -q 'src="${src}"' wishlist.js

      - name: Commit changes and remove temporary files
        run: |
          rm -f scripts/fix-secondary-wishlist-info-labels.py .github/workflows/fix-secondary-wishlist-info-labels.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix secondary wishlist posters and info labels [skip ci]"
          git push
