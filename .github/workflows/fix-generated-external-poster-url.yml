name: Fix generated external poster URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-generated-external-poster-url.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair accidental slash-prefixed absolute image URLs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              fixed = text.replace('src="/https://', 'src="https://').replace("src='/https://", "src='https://")
              if fixed != text:
                  path.write_text(fixed, encoding='utf-8')
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No accidental slash-prefixed absolute image URLs found')
          print('\n'.join(changed))
          PY
          ! grep -R -F 'src="/https://' --include='*.html' .
      - name: Commit cleanup
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-generated-external-poster-url.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix generated absolute poster URLs [skip ci]'
          git push origin main
