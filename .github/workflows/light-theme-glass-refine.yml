name: Light theme glass refinement

on:
  push:
    paths:
      - 'scripts/light-theme-glass-refine.py'
      - '.github/workflows/light-theme-glass-refine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refine light theme glass surfaces
        run: python scripts/light-theme-glass-refine.py
      - name: Validate JavaScript
        run: |
          node --check theme.js
          node --check language-switcher-compact.js
          node --check secondary-header.js
          node --check app.js
      - name: Commit changes and remove temporary files
        run: |
          rm -f scripts/light-theme-glass-refine.py .github/workflows/light-theme-glass-refine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refine light theme transparency and borders [skip ci]"
          git push origin main
