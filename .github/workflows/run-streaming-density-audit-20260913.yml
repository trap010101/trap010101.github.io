name: Streaming density audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-streaming-density-audit-20260913.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report sparse regional streaming coverage
        run: node scripts/report-pv-streaming-gaps.js
