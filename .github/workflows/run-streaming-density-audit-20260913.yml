name: Streaming density audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-streaming-density-audit-20260913.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate regional streaming data
        run: node scripts/validate-regional-streaming.js
      - name: Report sparse regional streaming coverage
        run: node scripts/report-pv-streaming-gaps.js
      - name: Locate regional streaming loaders
        shell: bash
        run: |
          grep -R -n --exclude-dir=.git -E 'streaming-(jp-20260906|us-20260906|kr-20260908)\.js' . || true

