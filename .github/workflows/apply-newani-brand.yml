name: Apply NewAnime brand assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-brand-assets:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact SVG logo
        shell: bash
        run: |
          set -euo pipefail
          cat .brand-parts/logo.part0 .brand-parts/logo.part1 .brand-parts/logo.part2 .brand-parts/logo.part3 .brand-parts/logo.part4 .brand-parts/logo.part5 > /tmp/newani-logo.svg.xz.b64
          base64 -d /tmp/newani-logo.svg.xz.b64 > /tmp/newani-logo.svg.xz
          xz -dc /tmp/newani-logo.svg.xz > assets/newanime-logo.svg
          test "$(wc -c < assets/newanime-logo.svg)" -eq 110462
          rm -rf .brand-parts
          rm -f .github/workflows/apply-newani-brand.yml
      - name: Commit restored SVG
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/newanime-logo.svg .brand-parts .github/workflows/apply-newani-brand.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Materialize SVG logo asset [skip ci]"
          git push
