name: Fix Timid MAX WebP format

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-timid-max-webp-format.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact logo-included teaser visual and encode real WebP
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow requests beautifulsoup4
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from PIL import Image
          import requests, hashlib

          pages = [
              'https://natalie.mu/comic/gallery/news/644194/2711940',
              'https://natalie.mu/comic/news/644194',
              'https://www.bs-asahi.co.jp/yowaki-max-anime/',
          ]
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
              'Accept-Language': 'ja,en-US;q=0.8,en;q=0.7',
          }

          def extract_urls(page_url):
              r = requests.get(page_url, headers=headers, timeout=30)
              print('page', page_url, r.status_code, len(r.content))
              r.raise_for_status()
              soup = BeautifulSoup(r.text, 'html.parser')
              urls = []
              for key in [('property','og:image'), ('name','twitter:image'), ('name','twitter:image:src')]:
                  tag = soup.find('meta', attrs={key[0]: key[1]})
                  if tag and tag.get('content'):
                      urls.append(urljoin(page_url, tag['content']))
              for img in soup.find_all('img'):
                  for attr in ('src','data-src','data-original','data-lazy-src'):
                      value = img.get(attr)
                      if value:
                          urls.append(urljoin(page_url, value))
              out = []
              seen = set()
              for u in urls:
                  if u not in seen:
                      seen.add(u)
                      out.append(u)
              return out

          selected = None
          selected_url = None
          errors = []
          for page in pages:
              try:
                  urls = extract_urls(page)
              except Exception as exc:
                  errors.append((page, repr(exc)))
                  continue
              for index, url in enumerate(urls):
                  try:
                      rr = requests.get(url, headers={**headers, 'Referer': page}, timeout=30)
                      if rr.status_code != 200 or len(rr.content) < 50000:
                          continue
                      img = Image.open(BytesIO(rr.content)).convert('RGB')
                      ratio = img.width / img.height
                      print('candidate', index, url, img.size, ratio)
                      if img.height >= 1000 and img.width >= 650 and 0.68 <= ratio <= 0.73:
                          selected = img
                          selected_url = url
                          break
                  except Exception:
                      continue
              if selected is not None:
                  break

          if selected is None:
              print('page errors=', errors)
              raise SystemExit('Could not obtain the logo/catchcopy portrait teaser visual')

          # Remove only genuinely blank near-white side gutters, never illustrated content.
          pix = selected.load()
          w, h = selected.size
          def blank_col(x):
              samples = 0
              white = 0
              step = max(1, h // 500)
              for y in range(0, h, step):
                  r,g,b = pix[x,y]
                  samples += 1
                  if r >= 248 and g >= 248 and b >= 248:
                      white += 1
              return white / samples >= 0.995

          left = 0
          while left < min(w//8, 160) and blank_col(left):
              left += 1
          right = w
          while right > max(w*7//8, w-160) and blank_col(right-1):
              right -= 1
          if left or right < w:
              print('crop side gutters:', left, w-right)
              selected = selected.crop((left, 0, right, h))

          target = Path('assets/posters/the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913-exact-v2.webp')
          target.parent.mkdir(parents=True, exist_ok=True)
          selected.save(target, 'WEBP', quality=90, method=6)
          raw = target.read_bytes()
          with Image.open(target) as check:
              check.load()
              print('selected_url=', selected_url)
              print('final=', check.format, check.size, len(raw))
              if check.format != 'WEBP':
                  raise SystemExit('Output is not a real WebP')
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('Invalid WebP RIFF signature')
          print('sha256=', hashlib.sha256(raw).hexdigest())
          PY

      - name: Point site references at repaired cache-busted asset
        run: |
          set -euo pipefail
          old='the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913-exact.webp'
          new='the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913-exact-v2.webp'
          grep -RIl --exclude-dir=.git --include='*.js' --include='*.html' "$old" . | while read -r f; do
            sed -i "s/$old/$new/g" "$f"
          done
          grep -RIl --exclude-dir=.git "$old" . || true

      - name: Remove broken asset and temporary staging fragments
        run: |
          rm -f assets/posters/the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913-exact.webp
          rm -f tmp/timid-max-exact-webp.part* tmp/timid-q82-*.b64 tmp/timid-q82-r*.b64

      - name: Commit repaired poster and cleanup
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-timid-max-webp-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair Timid MAX logo-included poster asset'
          git push origin main
