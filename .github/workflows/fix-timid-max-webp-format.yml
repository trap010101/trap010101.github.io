name: Fix Timid MAX WebP format

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-timid-max-webp-format.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-encode mislabeled poster as real WebP
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          path = Path('assets/posters/the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913-exact.webp')
          if not path.exists():
              raise SystemExit(f'Missing poster: {path}')

          with Image.open(path) as image:
              print('source_format=', image.format, 'size=', image.size)
              if image.size != (1086, 1536):
                  raise SystemExit(f'Unexpected source dimensions: {image.size}')
              rgb = image.convert('RGB')

          tmp = path.with_suffix('.tmp.webp')
          rgb.save(tmp, 'WEBP', quality=92, method=6)
          tmp.replace(path)

          raw = path.read_bytes()
          with Image.open(path) as check:
              print('target_format=', check.format, 'size=', check.size, 'bytes=', len(raw))
              if check.format != 'WEBP' or check.size != (1086, 1536):
                  raise SystemExit('Re-encoded poster validation failed')
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('WebP RIFF signature validation failed')
          print('sha256=', hashlib.sha256(raw).hexdigest())
          PY

      - name: Remove temporary staging fragments
        run: |
          rm -f tmp/timid-max-exact-webp.part* tmp/timid-q82-*.b64 tmp/timid-q82-r*.b64

      - name: Commit fixed poster and cleanup
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-timid-max-webp-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Timid MAX poster WebP encoding [skip ci]'
          git push origin main
