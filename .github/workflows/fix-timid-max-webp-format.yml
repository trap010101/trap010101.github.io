name: Fix Timid MAX WebP format

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-timid-max-webp-format.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact uploaded poster as valid WebP
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          cat tmp/timid-q82-00.b64 tmp/timid-q82-01.b64 tmp/timid-q82-02.b64 tmp/timid-q82-r00.b64 tmp/timid-q82-r01.b64 > /tmp/timid-max-upload.b64
          base64 --decode /tmp/timid-max-upload.b64 > /tmp/timid-max-upload.webp
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          src = Path('/tmp/timid-max-upload.webp')
          raw = src.read_bytes()
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('Invalid WebP RIFF signature')
          with Image.open(src) as im:
              im.load()
              print('format=', im.format, 'size=', im.size, 'bytes=', len(raw))
              if im.format != 'WEBP' or im.size != (1086, 1536):
                  raise SystemExit(f'Invalid rebuilt poster: {im.format} {im.size}')
          print('sha256=', hashlib.sha256(raw).hexdigest())
          PY
          target='assets/posters/the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913-exact-v3.webp'
          mkdir -p "$(dirname "$target")"
          mv /tmp/timid-max-upload.webp "$target"

      - name: Point references to repaired poster
        run: |
          set -euo pipefail
          for old in \
            the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913-exact.webp \
            the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913-exact-v2.webp
          do
            grep -RIl --exclude-dir=.git --include='*.js' --include='*.html' "$old" . | while read -r f; do
              sed -i "s/$old/the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913-exact-v3.webp/g" "$f"
            done || true
          done

      - name: Clean broken and temporary files
        run: |
          rm -f assets/posters/the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913-exact.webp
          rm -f assets/posters/the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913-exact-v2.webp
          rm -f tmp/timid-max-exact-webp.part* tmp/timid-q82-*.b64 tmp/timid-q82-r*.b64
          rm -f .github/workflows/fix-timid-max-webp-format.yml

      - name: Commit repaired poster
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair Timid MAX uploaded poster asset'
          git push origin main
