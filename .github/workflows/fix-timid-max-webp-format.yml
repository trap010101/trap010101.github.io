name: Fix Timid MAX WebP format

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-timid-max-webp-format.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact uploaded poster from staged WebP chunks
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          import base64, hashlib

          target = Path('assets/posters/the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913-exact.webp')
          target.parent.mkdir(parents=True, exist_ok=True)

          candidates = [
              [
                  Path('tmp/timid-q82-00.b64'),
                  Path('tmp/timid-q82-01.b64'),
                  Path('tmp/timid-q82-02.b64'),
                  Path('tmp/timid-q82-r00.b64'),
                  Path('tmp/timid-q82-r01.b64'),
              ],
              [
                  Path('tmp/timid-max-exact-webp.part0'),
                  Path('tmp/timid-max-exact-webp.part1'),
              ],
          ]

          chosen = None
          chosen_raw = None
          for parts in candidates:
              if not all(p.exists() for p in parts):
                  continue
              text = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
              try:
                  raw = base64.b64decode(text, validate=True)
                  if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
                      print('candidate is not RIFF/WEBP:', [str(p) for p in parts])
                      continue
                  with Image.open(BytesIO(raw)) as image:
                      image.load()
                      print('candidate=', [str(p) for p in parts], 'format=', image.format, 'size=', image.size, 'bytes=', len(raw))
                      if image.format != 'WEBP' or image.size != (1086, 1536):
                          continue
                  chosen = parts
                  chosen_raw = raw
                  break
              except Exception as exc:
                  print('candidate failed:', [str(p) for p in parts], repr(exc))

          if chosen_raw is None:
              raise SystemExit('No staged candidate reconstructed into a valid 1086x1536 WebP')

          target.write_bytes(chosen_raw)
          with Image.open(target) as check:
              check.load()
              if check.format != 'WEBP' or check.size != (1086, 1536):
                  raise SystemExit('Final poster validation failed')

          raw = target.read_bytes()
          print('selected=', [str(p) for p in chosen])
          print('final_format=WEBP size=1086x1536 bytes=', len(raw))
          print('sha256=', hashlib.sha256(raw).hexdigest())
          PY

      - name: Remove temporary staging fragments
        run: |
          rm -f tmp/timid-max-exact-webp.part* tmp/timid-q82-*.b64 tmp/timid-q82-r*.b64

      - name: Commit repaired poster and cleanup
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-timid-max-webp-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair Timid MAX uploaded poster WebP [skip ci]'
          git push origin main
