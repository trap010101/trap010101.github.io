name: Recompress large poster WebP assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recompress-posters-20260912.yml'

permissions:
  contents: write

jobs:
  recompress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tooling
        run: python3 -m pip install --quiet pillow

      - name: Recompress large WebP posters conservatively
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat
          import os, tempfile

          ROOT = Path('assets/posters')
          THRESHOLD = 320 * 1024
          MIN_SAVINGS = 0.12
          MAX_MAE = 3.5
          QUALITIES = (82, 86)

          scanned = 0
          candidates = 0
          changed = []
          skipped_quality = []
          skipped_savings = []
          total_before = 0
          total_after = 0

          def mae_rgb(a, b):
              if a.size != b.size:
                  return 999.0
              aa = a.convert('RGB')
              bb = b.convert('RGB')
              stat = ImageStat.Stat(ImageChops.difference(aa, bb))
              return sum(stat.mean) / 3.0

          for path in sorted(ROOT.rglob('*.webp')):
              scanned += 1
              before = path.stat().st_size
              if before <= THRESHOLD:
                  continue
              candidates += 1

              try:
                  with Image.open(path) as src:
                      if getattr(src, 'n_frames', 1) != 1:
                          print(f'SKIP animated: {path}')
                          continue
                      src.load()
                      original = src.copy()
                      original_size = original.size

                  best = None
                  for quality in QUALITIES:
                      fd, tmp_name = tempfile.mkstemp(suffix='.webp')
                      os.close(fd)
                      tmp = Path(tmp_name)
                      try:
                          save_kwargs = {
                              'format': 'WEBP',
                              'quality': quality,
                              'method': 6,
                          }
                          if 'A' in original.getbands():
                              save_kwargs['exact'] = True
                          original.save(tmp, **save_kwargs)
                          after = tmp.stat().st_size
                          with Image.open(tmp) as check:
                              check.load()
                              if check.size != original_size:
                                  raise RuntimeError(f'dimension mismatch for {path}')
                              error = mae_rgb(original, check)
                          savings = 1 - (after / before)
                          if error <= MAX_MAE:
                              best = (tmp.read_bytes(), after, quality, error, savings)
                              break
                      finally:
                          tmp.unlink(missing_ok=True)

                  if best is None:
                      skipped_quality.append(str(path))
                      print(f'SKIP quality: {path}')
                      continue

                  payload, after, quality, error, savings = best
                  if savings < MIN_SAVINGS:
                      skipped_savings.append(str(path))
                      print(f'KEEP {path}: {before/1024:.1f} KiB -> {after/1024:.1f} KiB ({savings*100:.1f}% saved, below threshold)')
                      continue

                  path.write_bytes(payload)
                  changed.append((str(path), before, after, quality, error, savings))
                  total_before += before
                  total_after += after
                  print(f'RECOMPRESS {path}: {before/1024:.1f} KiB -> {after/1024:.1f} KiB, -{savings*100:.1f}%, q={quality}, MAE={error:.2f}')
              except Exception as exc:
                  print(f'ERROR {path}: {exc}')
                  raise

          print('\n=== SUMMARY ===')
          print(f'scanned_webp={scanned}')
          print(f'large_candidates={candidates}')
          print(f'recompressed={len(changed)}')
          print(f'skipped_quality={len(skipped_quality)}')
          print(f'skipped_insufficient_savings={len(skipped_savings)}')
          if changed:
              saved = total_before - total_after
              print(f'total_before_bytes={total_before}')
              print(f'total_after_bytes={total_after}')
              print(f'total_saved_bytes={saved}')
              print(f'total_saved_mib={saved / 1024 / 1024:.2f}')
              print(f'weighted_reduction_percent={saved / total_before * 100:.1f}')
          PY

      - name: Validate changed images
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import subprocess

          changed = subprocess.check_output(['git', 'diff', '--name-only', '--', 'assets/posters']).decode().splitlines()
          if not changed:
              print('No poster assets met the recompression criteria.')
          for name in changed:
              path = Path(name)
              if path.suffix.lower() != '.webp':
                  raise SystemExit(f'Unexpected changed poster type: {name}')
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  print(f'VALID {name}: {image.size[0]}x{image.size[1]} {path.stat().st_size/1024:.1f} KiB')
          PY

      - name: Remove one-time workflow and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/recompress-posters-20260912.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No image assets changed.'
            exit 0
          fi
          git commit -m 'Recompress large poster WebP assets [skip ci]'
          git push origin HEAD:main
