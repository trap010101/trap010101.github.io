name: One-shot poster candidate probe

on:
  push:
    paths:
      - '.github/workflows/one-shot-poster-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - name: Probe candidates
        run: |
          cat > /tmp/probe.py <<'PY'
          import io,json,re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 Chrome/124 Safari/537.36'})
          targets={
            '俺と悠兄！':'https://oretoyunii.com/',
            'カリスマ':'https://anime.charisma-house.com/',
            'ブレス':'https://bless-anime.com/',
            'カグラバチ':'https://anime.kagurabachi.jp/',
            '海が走るエンドロール':'https://umi-endroll-movie.com/',
            'ペンと手錠と事実婚':'https://pentowappa-anime.com/',
            'ONE PIECE FILM GOD VALLEY':'https://www.onepiece-film.jp/',
            '桃源暗鬼':'https://www.tougenanki-anime.com/'
          }
          explicit=[
            'https://oretoyunii.com/assets/img/top/kv02.jpg',
            'https://oretoyunii.com/assets/img/top/kv01.jpg',
            'https://anime.charisma-house.com/wp-content/uploads/2026/03/visual.png',
            'https://anime.kagurabachi.jp/images/article/KB_teaser_EN.jpg',
            'https://umi-endroll-movie.com/img/visual.webp',
            'https://pentowappa-anime.com/assets/images/top/mainimg.webp',
            'https://pentowappa-anime.com/assets/images/top/mainimg_bg_02.webp',
            'https://bless-anime.com/assets/img/img_03.jpg',
            'https://tougenanki-anime.com/img/home/visual_07_sp.jpg',
            'https://www.tougenanki-anime.com/img/home/visual_07_sp.jpg'
          ]
          def info(u):
            try:
              r=S.get(u,timeout=15); r.raise_for_status()
              ct=r.headers.get('content-type','')
              try:
                im=Image.open(io.BytesIO(r.content)); w,h=im.size
                return {'url':u,'final':r.url,'w':w,'h':h,'ratio':round(w/h,4),'format':im.format,'bytes':len(r.content)}
              except: return {'url':u,'final':r.url,'status':r.status_code,'content_type':ct,'error':'not-image'}
            except Exception as e: return {'url':u,'error':type(e).__name__+': '+str(e)[:160]}
          out={'explicit':[info(u) for u in explicit],'sites':{}}
          for name,site in targets.items():
            try:
              r=S.get(site,timeout=15); r.raise_for_status(); html=r.text; base=r.url
              soup=BeautifulSoup(html,'html.parser'); urls=[]
              for tag in soup.find_all(['img','source']):
                for a in ('src','data-src','data-original','data-lazy-src','srcset'):
                  v=tag.get(a)
                  if not v: continue
                  for x in v.split(','):
                    u=x.strip().split(' ')[0]
                    if u and not u.startswith('data:'): urls.append(urljoin(base,u))
              for tag in soup.find_all('meta'):
                if (tag.get('property') or tag.get('name') or '').lower() in ('og:image','twitter:image','twitter:image:src') and tag.get('content'):
                  urls.append(urljoin(base,tag['content']))
              # simple image paths from HTML inline source
              for x in re.findall(r'["\']([^"\']+\.(?:jpg|jpeg|png|webp|avif)(?:\?[^"\']*)?)["\']',html,re.I): urls.append(urljoin(base,x))
              seen=[]
              for u in urls:
                if u not in seen: seen.append(u)
              infos=[]
              for u in seen[:100]:
                ii=info(u)
                if ii.get('w',0)>=500 and ii.get('h',0)>=500: infos.append(ii)
              infos.sort(key=lambda x:(abs(x.get('ratio',99)-0.6667),-(x.get('w',0)*x.get('h',0))))
              out['sites'][name]={'final':base,'images':infos[:25]}
            except Exception as e: out['sites'][name]={'error':repr(e)}
          open('.poster-probe.json','w',encoding='utf8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          python /tmp/probe.py
      - name: Commit probe report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .poster-probe.json
          git commit -m "Record official poster candidate probe" || exit 0
          git push origin main
