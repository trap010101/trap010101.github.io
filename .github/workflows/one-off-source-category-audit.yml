# one-off trigger
name: One-off source category audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-source-category-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add webtoon and web novel categories
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''    .badge.ln {
      color: #e6d6ff;
      background: rgba(178,140,255,.075);
    }

    .badge.original {''',
              '''    .badge.ln {
      color: #e6d6ff;
      background: rgba(178,140,255,.075);
    }

    .badge.webtoon {
      color: #d6f4ff;
      background: rgba(88,196,255,.075);
    }

    .badge.webnovel {
      color: #f6dfff;
      background: rgba(219,126,255,.075);
    }

    .badge.original {''',
              'badge styles',
          )

          replace_once(
              '''          <button class="chip" data-filter="comic">코믹스 원작</button>
          <button class="chip" data-filter="ln">라이트 노벨 원작</button>
          <button class="chip" data-filter="original">오리지널</button>''',
              '''          <button class="chip" data-filter="comic">코믹스 원작</button>
          <button class="chip" data-filter="ln">라이트 노벨 원작</button>
          <button class="chip" data-filter="webtoon">웹툰 원작</button>
          <button class="chip" data-filter="webnovel">웹소설 원작</button>
          <button class="chip" data-filter="original">오리지널</button>''',
              'filter buttons',
          )

          replace_once(
              '''        "귀환자의 마법은 특별해야 합니다 2기",
        "10월",
        [
          "series"
        ]''',
              '''        "귀환자의 마법은 특별해야 합니다 2기",
        "10월",
        [
          "series",
          "webtoon",
          "webnovel"
        ]''',
              'Returner source tags',
          )

          replace_once(
              '''        "좀비가 넘쳐나는 세상에서 나만 습격당하지 않는다",
        "1월",
        [
          "new",
          "ln"
        ]''',
              '''        "좀비가 넘쳐나는 세상에서 나만 습격당하지 않는다",
        "1월",
        [
          "new",
          "ln",
          "webnovel"
        ]''',
              'Zombie source tags',
          )

          replace_once(
              '''    "comic": "코믹스 원작",
    "ln": "라이트 노벨 원작",
    "original": "오리지널",''',
              '''    "comic": "코믹스 원작",
    "ln": "라이트 노벨 원작",
    "webtoon": "웹툰 원작",
    "webnovel": "웹소설 원작",
    "original": "오리지널",''',
              'Korean locale',
          )

          replace_once(
              '''    "comic": "漫画原作",
    "ln": "ライトノベル原作",
    "original": "オリジナル",''',
              '''    "comic": "漫画原作",
    "ln": "ライトノベル原作",
    "webtoon": "ウェブトゥーン原作",
    "webnovel": "Web小説原作",
    "original": "オリジナル",''',
              'Japanese locale',
          )

          replace_once(
              '''    "comic": "Manga",
    "ln": "Light Novel",
    "original": "Original",''',
              '''    "comic": "Manga",
    "ln": "Light Novel",
    "webtoon": "Webtoon",
    "webnovel": "Web Novel",
    "original": "Original",''',
              'English locale',
          )

          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          grep -Fq 'data-filter="webtoon">웹툰 원작' index.html
          grep -Fq 'data-filter="webnovel">웹소설 원작' index.html
          grep -Fq '"webtoon": "웹툰 원작"' index.html
          grep -Fq '"webnovel": "웹소설 원작"' index.html
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert '"귀환자의 마법은 특별해야 합니다 2기",\n        "10월",\n        [\n          "series",\n          "webtoon",\n          "webnovel"' in text
          assert '"좀비가 넘쳐나는 세상에서 나만 습격당하지 않는다",\n        "1월",\n        [\n          "new",\n          "ln",\n          "webnovel"' in text
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add webtoon and web novel source categories'
          git push
