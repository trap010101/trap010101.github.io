name: Sort dated anime entries

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-index:
    if: github.event.head_commit.message == 'Run anime date sorting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update schedule order
        run: python tools/temp_sort_dated_anime.py
      - name: Validate JavaScript syntax
        run: node --check tools/temp_inline_script.js
      - name: Commit changes
        run: |
          rm .github/workflows/temp-sort-dated-anime.yml
          rm tools/temp_sort_dated_anime.py
          rm tools/temp_inline_script.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sort anime by confirmed broadcast date"
          git push origin main
