name: Home performance v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/home-performance-v1.py'
      - '.github/workflows/home-performance-v1.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused performance patch
        run: python3 scripts/home-performance-v1.py

      - name: Syntax and focused regression checks
        run: |
          node --check app.js
          node --test tests/schedule.test.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          scripts = re.findall(r'<script defer src="([^"]+)"', html)
          assert len(scripts) >= 20, f'expected deferred runtime scripts, got {len(scripts)}'
          assert 'app.js?v=20260912-perf1' in html
          assert 'styles.css?v=20260912-perf1' in html
          app = Path('app.js').read_text()
          assert 'const shouldRender = activeYear === 2027;' in app
          assert 'new IntersectionObserver(entries =>' in app
          css = Path('styles.css').read_text()
          assert 'content-visibility: auto' in css
          print(f'validated {len(scripts)} deferred scripts')
          PY

      - name: Remove one-time patch files
        run: rm -f scripts/home-performance-v1.py .github/workflows/home-performance-v1.yml

      - name: Commit optimized production files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Optimize homepage initial loading [skip ci]'
          git push origin HEAD:main
