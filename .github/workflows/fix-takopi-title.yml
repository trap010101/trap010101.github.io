name: Apply Takopi title correction

on:
  push:
    paths:
      - '.github/workflows/fix-takopi-title.yml'

permissions:
  contents: write

jobs:
  fix-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for concurrent generation and refresh main
        run: |
          sleep 55
          git fetch origin main
          git reset --hard origin/main

      - name: Apply title correction and cache bump
        shell: python
        run: |
          from pathlib import Path
          import re

          fixes = Path('data/title-fixes-20260905.js')
          text = fixes.read_text(encoding='utf-8')
          marker = '  if (!Array.isArray(window.animeData)) return;\n'
          block = '''\n  const takopisOriginalSin = window.animeData.find(\n    item => item.id === "takopis-original-sin-thank-you-see-you-tomorrow"\n  );\n  if (takopisOriginalSin) {\n    takopisOriginalSin.title = {\n      ...takopisOriginalSin.title,\n      ko: "타코피의 원죄 -고마워, 또 만나-"\n    };\n    takopisOriginalSin.updatedAt = "2026-09-09";\n  }\n'''
          if 'const takopisOriginalSin = window.animeData.find(' not in text:
              if marker not in text:
                  raise SystemExit('title-fixes insertion marker not found')
              text = text.replace(marker, marker + block, 1)
              fixes.write_text(text, encoding='utf-8')

          pattern = re.compile(r'title-fixes-20260905\.js\?v=[A-Za-z0-9._-]+')
          replacement = 'title-fixes-20260905.js?v=20260909-title2'
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in {'.js', '.html'}:
                  continue
              try:
                  source = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = pattern.sub(replacement, source)
              if updated != source:
                  path.write_text(updated, encoding='utf-8')

      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Correct Takopi Korean title'
          git pull --rebase origin main
          git push origin HEAD:main
