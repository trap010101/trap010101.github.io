name: Expand Japanese streaming coverage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-jp-streaming-20260913.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add verified U-NEXT alternatives
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data/streaming-jp-20260906.js')
          s = p.read_text()
          replacements = {
            '"sound-euphonium-the-final-movement-part-2": { danime: dAnime("20098") },': '"sound-euphonium-the-final-movement-part-2": { danime: dAnime("20098"), unext: "https://www.video.unext.jp/title/SID0315530" },',
            '"the-apothecary-diaries-season-3-part-1": { danime: dAnime("26610") },': '"the-apothecary-diaries-season-3-part-1": { danime: dAnime("26610"), unext: "https://www.video.unext.jp/title/SID0163357" },',
            '"girls-und-panzer-das-finale-part-5": { danime: dAnime("20431") },': '"girls-und-panzer-das-finale-part-5": { danime: dAnime("20431"), unext: "https://www.video.unext.jp/title/SID0002511" },',
            '"rascal-does-not-dream-of-a-dear-friend": { danime: dAnime("28053") },': '"rascal-does-not-dream-of-a-dear-friend": { danime: dAnime("28053"), unext: "https://www.video.unext.jp/title/SID0200159" },',
            '"made-in-abyss-theatrical-series-part-1-the-awakening-mystery": { danime: dAnime("22458") },': '"made-in-abyss-theatrical-series-part-1-the-awakening-mystery": { danime: dAnime("22458"), unext: "https://www.video.unext.jp/title/SID0070853" },',
            '"black-clover-2nd-season": { danime: dAnime("25854") },': '"black-clover-2nd-season": { danime: dAnime("25854"), unext: "https://www.video.unext.jp/title/SID0031251" },',
            '"the-apothecary-diaries-the-late-consorts-secret-treasure": { danime: dAnime("26610") },': '"the-apothecary-diaries-the-late-consorts-secret-treasure": { danime: dAnime("26610"), unext: "https://www.video.unext.jp/title/SID0163357" },',
            '"the-apothecary-diaries-season-3-part-2": { danime: dAnime("26610") },': '"the-apothecary-diaries-season-3-part-2": { danime: dAnime("26610"), unext: "https://www.video.unext.jp/title/SID0163357" },',
            '"frieren-beyond-journeys-end-season-3-golden-land-arc": { danime: dAnime("26609") },': '"frieren-beyond-journeys-end-season-3-golden-land-arc": { danime: dAnime("26609"), unext: "https://www.video.unext.jp/title/SID0091754" },',
            '"dan-da-dan-season-3": { danime: dAnime("27283") },': '"dan-da-dan-season-3": { danime: dAnime("27283"), unext: "https://www.video.unext.jp/title/SID0200132" },',
            '"konosuba-gods-blessing-on-this-wonderful-world-season-4": { danime: dAnime("20525") },': '"konosuba-gods-blessing-on-this-wonderful-world-season-4": { danime: dAnime("20525"), unext: "https://www.video.unext.jp/title/SID0100051" },',
            '"laid-back-camp-season-4": { danime: dAnime("21928") },': '"laid-back-camp-season-4": { danime: dAnime("21928"), unext: "https://www.video.unext.jp/title/SID0095777" },',
            '"the-dangers-in-my-heart-season-3": { danime: dAnime("27390") },': '"the-dangers-in-my-heart-season-3": { danime: dAnime("27390"), unext: "https://www.video.unext.jp/title/SID0096010" },',
            '"oblivion-battery-season-2": { danime: dAnime("27004") },': '"oblivion-battery-season-2": { danime: dAnime("27004"), unext: "https://www.video.unext.jp/title/SID0100046" },',
            '"the-rising-of-the-shield-hero-season-5": { danime: dAnime("22568") },': '"the-rising-of-the-shield-hero-season-5": { danime: dAnime("22568"), unext: "https://www.video.unext.jp/title/SID0039229" },',
            '"haikyu-the-movie-vs-the-little-giant": { danime: dAnime("20140") },': '"haikyu-the-movie-vs-the-little-giant": { danime: dAnime("20140"), unext: "https://www.video.unext.jp/title/SID0045516" },',
            '"the-eminence-in-shadow-lost-echoes": { danime: dAnime("25786") },': '"the-eminence-in-shadow-lost-echoes": { danime: dAnime("25786"), unext: "https://www.video.unext.jp/title/SID0073140" },',
            '"girls-und-panzer-motto-love-love-operation": { danime: dAnime("20431") },': '"girls-und-panzer-motto-love-love-operation": { danime: dAnime("20431"), unext: "https://www.video.unext.jp/title/SID0002511" },',
            '"haikyu-monsters-go-where": { danime: dAnime("20140") },': '"haikyu-monsters-go-where": { danime: dAnime("20140"), unext: "https://www.video.unext.jp/title/SID0045516" },'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing JP audit anchor: {old}')
              s = s.replace(old, new, 1)
          s = s.replace('verifiedAt: "2026-09-07",', 'verifiedAt: "2026-09-13",', 1)
          p.write_text(s)
          PY
      - name: Validate regional data
        run: node scripts/validate-regional-streaming.js
      - name: Commit expansion and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/expand-jp-streaming-20260913.yml
          git add data/streaming-jp-20260906.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expand Japanese previous-series streaming links [skip ci]"
          git push
