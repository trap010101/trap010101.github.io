name: Add game-origin tags

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-game-origin-tags.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update game-origin tags and filter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def require_one(n, label):
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')

          if '.badge.game {' not in text:
              pattern = re.compile(r'(\n\s*\.badge\.webnovel\s*\{.*?\n\s*\}\n)(\n\s*\.badge\.original\s*\{)', re.S)
              replacement = (
                  r'\1\n'
                  '    .badge.game {\n'
                  '      color: #d8e4ff;\n'
                  '      background: rgba(104,143,255,.075);\n'
                  '    }\n'
                  r'\2'
              )
              text, n = pattern.subn(replacement, text, count=1)
              require_one(n, 'game badge style')

          if 'data-filter="game"' not in text:
              pattern = re.compile(r'(?m)^(?P<i>[ \t]*)<button class="chip" data-filter="webnovel">웹소설 원작</button>[ \t]*$')
              def add_filter(m):
                  i = m.group('i')
                  return m.group(0) + f'\n{i}<button class="chip" data-filter="game">게임 원작</button>'
              text, n = pattern.subn(add_filter, text, count=1)
              require_one(n, 'game filter button')

          targets = [
              'SEKIRO: NO DEFEAT',
              '사이버펑크: 엣지러너 2',
              'DARK MACHINE THE ANIMATION (다크 머신 더 애니메이션)',
              '환상수호전',
              '魔法使いの夜',
              'DEATH STRANDING ISOLATIONS — Working Title (데스 스트랜딩 아이솔레이션즈 · 가제)',
              'Ghost of Tsushima: Legends (고스트 오브 쓰시마: 레전드)',
          ]

          def add_game_tag(source, title):
              pattern = re.compile(
                  re.escape(f'"{title}"') +
                  r'\s*,\s*(?:"[^"]*"\s*,\s*)?' +
                  r'(?P<open>\[\s*)' +
                  r'(?P<body>"[^"]+"(?:\s*,\s*"[^"]+")*)' +
                  r'\s*(?P<close>\])'
              )
              match = pattern.search(source)
              if not match:
                  raise SystemExit(f'tag array not found: {title}')

              tags = re.findall(r'"([^"]+)"', match.group('body'))
              if 'game' in tags:
                  return source

              if 'movie' in tags:
                  tags.insert(tags.index('movie'), 'game')
              else:
                  tags.append('game')

              open_text = match.group('open')
              if '\n' in open_text:
                  indent = open_text.rsplit('\n', 1)[1]
                  separator = ',\n' + indent
              else:
                  separator = ', '
              new_body = separator.join(f'"{tag}"' for tag in tags)
              return source[:match.start('body')] + new_body + source[match.end('body'):]

          for title in targets:
              before = text
              text = add_game_tag(text, title)
              if text == before:
                  raise SystemExit(f'game tag was not added: {title}')

          locale_pairs = [
              ('웹소설 원작', '게임 원작', 'ko game locale'),
              ('Web小説原作', 'ゲーム原作', 'ja game locale'),
              ('Web Novel', 'Game', 'en game locale'),
          ]
          for webnovel_value, game_value, label in locale_pairs:
              if f'"game": "{game_value}"' in text:
                  continue
              pattern = re.compile(rf'(?m)^(?P<i>[ \t]*)"webnovel": "{re.escape(webnovel_value)}",[ \t]*$')
              def add_locale(m, game_value=game_value):
                  i = m.group('i')
                  return m.group(0) + f'\n{i}"game": "{game_value}",'
              text, n = pattern.subn(add_locale, text, count=1)
              require_one(n, label)

          if 'game: "game"' not in text:
              pattern = re.compile(r'(?m)^(?P<i>[ \t]*)ln: "ln",[ \t]*$')
              def add_filter_name(m):
                  i = m.group('i')
                  return m.group(0) + f'\n{i}game: "game",'
              text, n = pattern.subn(add_filter_name, text, count=1)
              require_one(n, 'filterNames game entry')

          checks = [
              ('data-filter="game"', 'game filter missing'),
              ('.badge.game {', 'game badge style missing'),
              ('"game": "게임 원작"', 'ko game locale missing'),
              ('"game": "ゲーム原作"', 'ja game locale missing'),
              ('"game": "Game"', 'en game locale missing'),
              ('game: "game"', 'filterNames game entry missing'),
          ]
          for needle, message in checks:
              if needle not in text:
                  raise SystemExit(message)

          for title in targets:
              pattern = re.compile(
                  re.escape(f'"{title}"') +
                  r'\s*,\s*(?:"[^"]*"\s*,\s*)?\[(?P<body>.*?)\]',
                  re.S,
              )
              match = pattern.search(text)
              if not match or '"game"' not in match.group('body'):
                  raise SystemExit(f'validation failed for: {title}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes and remove migration workflow
        shell: bash
        run: |
          rm .github/workflows/add-game-origin-tags.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-game-origin-tags.yml
          git commit -m "Add game-origin tags and filter"
          git push origin main
