name: Fix Takopi trailing hyphen

on:
  push:
    paths:
      - '.github/workflows/fix-takopi-trailing-hyphen-20260909.yml'

permissions:
  contents: write

jobs:
  fix-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add missing trailing hyphen everywhere
        shell: python
        run: |
          from pathlib import Path
          import re

          pattern = re.compile(r'타코피의 원죄 -고마워, 또 만나(?!-)')
          replacement = '타코피의 원죄 -고마워, 또 만나-'
          changed = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in {'.html', '.js'}:
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = pattern.sub(replacement, original)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Updated files:', len(changed))
          for item in changed:
              print(item)

      - name: Regenerate anime pages
        run: node scripts/generate-anime-pages.js

      - name: Verify corrected title
        shell: python
        run: |
          from pathlib import Path

          correct = '타코피의 원죄 -고마워, 또 만나-'
          wrong = '타코피의 원죄 -고마워, 또 만나'
          double = '타코피의 원죄 -고마워, 또 만나--'

          targets = [
              Path('anime/takopis-original-sin-thank-you-see-you-tomorrow/index.html'),
              Path('2026/index.html'),
              Path('2026/11/index.html'),
              Path('data/anime.js'),
              Path('data/title-fixes-20260905.js'),
          ]

          for path in targets:
              text = path.read_text(encoding='utf-8')
              if correct not in text:
                  raise SystemExit(f'Correct title missing from {path}')
              if double in text:
                  raise SystemExit(f'Double trailing hyphen found in {path}')
              if wrong in text.replace(correct, ''):
                  raise SystemExit(f'Uncorrected title remains in {path}')

      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Fix Takopi Korean title trailing hyphen [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
