name: One-off anime link audit 2026-09-01

on:
  push:
    paths:
      - .github/workflows/one-off-anime-link-audit-20260901.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch audited PV and streaming links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          pv_updates = [
              ("SEKIRO: NO DEFEAT", "https://www.youtube.com/watch?v=y5MiWXKGVyc"),
              ("신 테니스의 왕자", "https://youtu.be/LLCVfhquaAU"),
              ("DARK MACHINE THE ANIMATION", "https://youtu.be/P8FfvDLyMrY"),
              ("FX戦士くるみちゃん", "https://www.youtube.com/watch?v=7rxIZ3z0S4s"),
              ("dreamland", "https://www.youtube.com/watch?v=KCElr-mqyRI"),
              ("ダークサモナーとデキている", "https://www.youtube.com/watch?v=k9lQpVYUoE4"),
              ("バーテックスフォース", "https://www.youtube.com/watch?v=Rpl17n7j3yM"),
              ("彼女の友達", "https://www.youtube.com/watch?v=ifIEcvYJwcE"),
              ("彼方から", "https://www.youtube.com/watch?v=ois8bCu2Ba8"),
              ("朱色の仮面", "https://www.youtube.com/watch?v=PJxXARIko6k"),
              ("獣王武神ダンデヴァイン", "https://youtu.be/xnNiim95Cpo"),
              ("紫禁・御猫房", "https://youtu.be/DccimlS6Ob8"),
              ("ラーメン赤猫", "https://www.youtube.com/watch?v=DK7UiS4hMz0"),
              ("俺と悠兄", "https://youtu.be/D9XV4WQ7ok0"),
              ("BanG Dream! It's MyGO!!!!! / Ave Mujica", "https://youtu.be/KIouqiMmyP8"),
              ("どこよりも遠い場所にいる君へ", "https://www.youtube.com/watch?v=J2tjySs8UbA"),
              ("BanG Dream! Ave Mujica prima aurora", "https://www.youtube.com/watch?v=Uqt2rXUA-r8"),
              ("劇場シリーズ【第一部】メイドインアビス", "https://www.youtube.com/watch?v=Sy7cLG6XHRY"),
              ("装甲騎兵ボトムズ 灰色の魔女", "https://www.youtube.com/watch?v=uRClWlt6mKM"),
              ("劇場版ハイキュー!! VS 小さな巨人", "https://www.youtube.com/watch?v=oI4iygnPFDM"),
              ("風を継ぐもの", "https://www.youtube.com/watch?v=RWUIMxHyNoM"),
              ("欠けた月のメルセデス", "https://www.youtube.com/watch?v=JXLbivdiGLc"),
              ("가챠를 돌려", "https://www.youtube.com/watch?v=EmAwUt5QZug"),
              ("결계사의 일륜화", "https://www.youtube.com/watch?v=UddBplRM1cY"),
              ("잡용부여술사", "https://www.youtube.com/watch?v=Glbj6ELFK18"),
              ("좀비가 넘쳐나는 세상에서 나만 습격당하지 않는다", "https://www.youtube.com/watch?v=CdK-jOoFgtY"),
              ("カリスマ", "https://www.youtube.com/watch?v=Z80hyl7HdYA"),
              ("카리스마", "https://www.youtube.com/watch?v=Z80hyl7HdYA"),
              ("펜과 수갑과 사실혼", "https://www.youtube.com/watch?v=GpsgYnS0p8I"),
              ("尚善", "https://www.youtube.com/watch?v=T50_vLX7qrA"),
              ("망각 배터리 2기", "https://www.youtube.com/watch?v=xAdPHii2EQA"),
              ("ブレス", "https://www.youtube.com/watch?v=ECI_iIX7LU0"),
              ("블레스", "https://www.youtube.com/watch?v=ECI_iIX7LU0"),
              ("THE ONE PIECE", "https://www.youtube.com/watch?v=zVXKN5pxbcI"),
          ]

          pv_count = 0
          for fragment, url in pv_updates:
              pattern = re.compile(r'("[^"]*' + re.escape(fragment) + r'[^"]*"\s*:\s*\{\s*"pv"\s*:\s*)null')
              text, count = pattern.subn(
                  lambda match: match.group(1) + json.dumps(url, ensure_ascii=False),
                  text,
                  count=1,
              )
              print(f"PV {fragment}: {count}")
              pv_count += count

          start_marker = "// BEGIN LINK AUDIT 2026-09-01"
          end_marker = "// END LINK AUDIT 2026-09-01"
          if start_marker in text and end_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start) + len(end_marker)
              text = text[:start] + text[end:]

          resource_part = text.split("const ottPlatforms =", 1)[0]
          streaming_updates = [
              ("FX戦士くるみちゃん", {"officialstream": "https://fxkurumi-info.com/onair/"}),
              ("バーテックスフォース", {"officialstream": "https://vertexforce.jp/onair/"}),
              ("Duel Masters LOST", {"officialstream": "https://www.shopro.co.jp/anime/duelmasters_lost/"}),
              ("잡용부여술사", {"officialstream": "https://zatsuyofuyo-pr.com/"}),
              ("DEATH STRANDING ISOLATIONS", {"disney": "https://www.disneyplus.com/ja-jp/explore/articles/death_stranding_isolations_1113"}),
          ]

          resolved_streaming = {}
          for fragment, links in streaming_updates:
              match = re.search(
                  r'"([^"]*' + re.escape(fragment) + r'[^"]*)"\s*:\s*\{\s*"pv"',
                  resource_part,
              )
              if match:
                  resolved_streaming[match.group(1)] = links
                  print(f"OTT {fragment}: {match.group(1)} -> {links}")
              else:
                  print(f"OTT MISS {fragment}")

          block = "\n".join([
              start_marker,
              'if (!ottPlatforms.some((platform) => platform.id === "officialstream")) {',
              '  ottPlatforms.push({ id: "officialstream", name: "공식 배급 안내" });',
              '}',
              'const auditedOttLinks20260901 = ' + json.dumps(resolved_streaming, ensure_ascii=False, indent=2) + ';',
              'for (const [title, links] of Object.entries(auditedOttLinks20260901)) {',
              '  ottLinks[title] = Object.assign({}, ottLinks[title] || {}, links);',
              '}',
              end_marker,
          ])

          marker = "const titleLocales = {"
          if marker not in text:
              raise SystemExit("titleLocales marker missing")
          text = text.replace(marker, block + "\n\n" + marker, 1)
          path.write_text(text, encoding="utf-8")

          print(f"PV_COUNT={pv_count}")
          print(f"OTT_COUNT={len(resolved_streaming)}")
          PY

      - name: Commit link audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes"
          else
            git commit -m "Update anime PV and streaming links"
            git push
          fi
