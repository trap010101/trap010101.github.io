name: Refresh regional streaming cache keys

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-streaming-cache-20260913.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump regional streaming cache keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('index.html'): {
                  'data/streaming-jp-20260906.js?v=20260908-previous-series1': 'data/streaming-jp-20260906.js?v=20260913-coverage3',
                  'data/streaming-us-20260906.js?v=20260908-previous-series1': 'data/streaming-us-20260906.js?v=20260913-coverage3',
                  'data/streaming-kr-20260908.js?v=20260908-verified2': 'data/streaming-kr-20260908.js?v=20260913-coverage3',
              },
              Path('anime-links.js'): {
                  '/data/streaming-jp-20260906.js?v=20260906-region1': '/data/streaming-jp-20260906.js?v=20260913-coverage3',
                  '/data/streaming-us-20260906.js?v=20260906-region1': '/data/streaming-us-20260906.js?v=20260913-coverage3',
                  '/data/streaming-kr-20260908.js?v=20260913-region2': '/data/streaming-kr-20260908.js?v=20260913-coverage3',
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text()
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f'missing cache anchor in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Verify cache keys
        run: |
          grep -n 'streaming-jp-20260906.js?v=20260913-coverage3' index.html anime-links.js
          grep -n 'streaming-us-20260906.js?v=20260913-coverage3' index.html anime-links.js
          grep -n 'streaming-kr-20260908.js?v=20260913-coverage3' index.html anime-links.js
      - name: Commit and clean temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/bump-streaming-cache-20260913.yml
          git add index.html anime-links.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh regional streaming cache keys [skip ci]"
          git push
