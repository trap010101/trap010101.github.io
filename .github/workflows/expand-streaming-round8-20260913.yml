name: Expand regional streaming coverage round 8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-streaming-round8-20260913.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add verified regional alternatives
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Japan: add second verified services for remaining sparse previous-series entries.
          jp = Path('data/streaming-jp-20260906.js')
          s = jp.read_text()
          replacements = {
              '"one-piece-film-god-valley": { unext: "https://video.unext.jp/title/SID0011124" },':
                  '"one-piece-film-god-valley": { unext: "https://video.unext.jp/title/SID0011124", danime: dAnime("20516") },',
              '"gate-season-2": { unext: "https://www.video.unext.jp/title/SID0018898" },':
                  '"gate-season-2": { unext: "https://www.video.unext.jp/title/SID0018898", danime: dAnime("20944") },',
              '"duel-masters-lost-condemned-boy": { unext: "https://www.video.unext.jp/title/SID0157483" },':
                  '"duel-masters-lost-condemned-boy": { unext: "https://www.video.unext.jp/title/SID0157483", danime: dAnime("28584") },',
              '"cardfight-vanguard-divinez-fate-star-war-arc": { unext: "https://www.video.unext.jp/title/SID0096699" },':
                  '"cardfight-vanguard-divinez-fate-star-war-arc": { unext: "https://www.video.unext.jp/title/SID0096699", danime: dAnime("26818") },'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing JP anchor: {old}')
              s = s.replace(old, new, 1)
          jp.write_text(s)

          # Korea: add verified WATCHA/TVING alternatives while preserving legacy links.
          kr = Path('data/streaming-kr-20260908.js')
          s = kr.read_text()
          marker = '    "one-piece-film-god-valley": {'
          if marker not in s:
              raise SystemExit('missing KR insertion marker')
          if '"tiger-coming-in-2"' not in s:
              entries = '\n'.join([
                  '    "tiger-coming-in-2": {',
                  '      laftel: "https://laftel.net/item/42320",',
                  '      watcha: "https://watcha.com/ko/contents/tRbq6Lg",',
                  '      tving: "https://www.tving.com/contents/P001775884"',
                  '    },',
                  '    "girls-und-panzer-motto-love-love-operation": {',
                  '      netflix: "https://www.netflix.com/kr/title/80205232",',
                  '      watcha: "https://watcha.com/ko/contents/mOVPgwY"',
                  '    },',
                  ''
              ])
              s = s.replace(marker, entries + marker, 1)
          else:
              raise SystemExit('KR round8 entries already present unexpectedly')
          kr.write_text(s)

          # US: add verified independent subscription alternatives.
          us = Path('data/streaming-us-20260906.js')
          s = us.read_text()
          replacements = {
              '"medalist-the-movie": {\n      hulu_us: "https://www.hulu.com/series/medalist-bb33d0c2-b077-4bc0-a549-d2ca27d4afa8"\n    },':
                  '"medalist-the-movie": {\n      hulu_us: "https://www.hulu.com/series/medalist-bb33d0c2-b077-4bc0-a549-d2ca27d4afa8",\n      disney: "https://www.disneyplus.com/browse/entity-da70811f-59de-4f75-97f2-6b534c44626d"\n    },',
              '"mission-yozakura-family-season-2-part-2": {\n      hulu_us: "https://www.hulu.com/series/mission-yozakura-family-ac689bea-f955-4d95-8693-7b87b5a309cb"\n    },':
                  '"mission-yozakura-family-season-2-part-2": {\n      hulu_us: "https://www.hulu.com/series/mission-yozakura-family-ac689bea-f955-4d95-8693-7b87b5a309cb",\n      disney: "https://www.disneyplus.com/browse/entity-b151ff3b-c3d2-4e8f-9fc2-dc07af6dbcc5"\n    },',
              '"gate-season-2": {\n      crunchyroll: "https://www.crunchyroll.com/series/GRGG9PN7R/gate"\n    },':
                  '"gate-season-2": {\n      crunchyroll: "https://www.crunchyroll.com/series/GRGG9PN7R/gate",\n      hulu_us: "https://www.hulu.com/series/ce311a68-cf4d-417c-902d-a188af25a6b0"\n    },'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing US anchor: {old[:100]}')
              s = s.replace(old, new, 1)
          us.write_text(s)

          # Bump regional data cache key for homepage and detail-page loader.
          for path in [Path('index.html'), Path('anime-links.js')]:
              text = path.read_text()
              if '20260913-coverage7' not in text:
                  raise SystemExit(f'missing coverage7 cache key in {path}')
              path.write_text(text.replace('20260913-coverage7', '20260913-coverage8'))
          PY

      - name: Validate regional streaming data
        run: node scripts/validate-regional-streaming.js

      - name: Report updated sparse coverage
        run: node scripts/report-pv-streaming-gaps.js

      - name: Verify cache refresh
        run: grep -n '20260913-coverage8' index.html anime-links.js

      - name: Commit expansion and clean workflow
        shell: bash
        run: |
          git rm .github/workflows/expand-streaming-round8-20260913.yml
          git add data/streaming-jp-20260906.js data/streaming-kr-20260908.js data/streaming-us-20260906.js index.html anime-links.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expand remaining regional previous-series streaming links"
          git push
