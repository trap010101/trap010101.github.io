name: Temporary timeline label cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-index:
    if: github.event.head_commit.message == 'Temporary timeline label cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Simplify timeline labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # Remove "진입" wording from season data.
          text = text.replace('"season": "2026 가을 진입"', '"season": "2026 가을"')
          text = text.replace('"season": "2026 겨울 진입"', '"season": "2026 겨울"')

          # Clean up season localization labels so no "진입" wording remains.
          text = text.replace('  "2026 가을 진입": {ko:"2026 가을 진입", ja:"2026年 秋シーズン前", en:"Entering Fall 2026"},\n', '')
          text = text.replace('  "2026 겨울 진입": {ko:"2026 겨울 진입", ja:"2026年 冬シーズン前", en:"Entering Winter 2026"},', '  "2026 겨울": {ko:"2026 겨울", ja:"2026年 冬", en:"Winter 2026"},')

          # Remove the season subtext displayed below each year/month heading.
          text = text.replace('            <small>${localSeason(month.season)}</small>\n', '')
          text = re.sub(r'\n    \.month-head small \{\n      color: var\(--muted\);\n      font-weight: 700;\n    \}\n', '\n', text)

          # Replace the year-end date label with December and remove obsolete localization handling.
          text = text.replace('        "연말",', '        "12월",')
          text = text.replace('  if (date === "연말") return activeLang === "ko" ? "연말" : activeLang === "ja" ? "年末" : "Year-end";\n', '')

          if text == original:
              raise SystemExit('No expected changes were found in index.html')
          if '진입' in text:
              raise SystemExit('Unexpected remaining 진입 text in index.html')
          if '연말' in text:
              raise SystemExit('Unexpected remaining 연말 text in index.html')
          if '<small>${localSeason(month.season)}</small>' in text:
              raise SystemExit('Month season subtext still remains')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify timeline labels"
          git push origin main
