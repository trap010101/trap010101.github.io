name: Light theme category/menu v8

on:
  push:
    paths:
      - 'scripts/light-theme-category-menu-v8.py'
      - '.github/workflows/light-theme-category-menu-v8.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply light theme category and menu polish
        run: python3 scripts/light-theme-category-menu-v8.py

      - name: Validate JavaScript
        run: |
          node --check theme.js
          node --check language-switcher-compact.js
          node --check secondary-header.js

      - name: Commit changes and remove temporary files
        run: |
          rm -f scripts/light-theme-category-menu-v8.py .github/workflows/light-theme-category-menu-v8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine light theme category colors and menu opacity [skip ci]"
          git push origin main
