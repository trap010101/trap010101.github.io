name: One-shot center poster fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-center-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '"도원암귀 닛코·게곤 폭포편": "right center"': '"도원암귀 닛코·게곤 폭포편": "center center"',
              '"楽園追放 心のレゾナンス": "right center"': '"楽園追放 心のレゾナンス": "center center"',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit index.html
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Center Rakuen Tsuiho and Tougen Anki posters"
          git push origin HEAD:main
