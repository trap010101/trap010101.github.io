name: Fix KR streaming loader sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-kr-streaming-loader-20260913.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync KR streaming source across loaders
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_files = [
              Path('scripts/enhance-streaming-regions.js'),
              Path('scripts/validate-regional-streaming.js'),
              Path('scripts/validate-streaming-regions.js'),
          ]
          for path in source_files:
              text = path.read_text()
              if "'data/streaming-kr-20260908.js'" not in text:
                  old = "  'data/streaming-policy-20260905.js'\n];"
                  new = "  'data/streaming-policy-20260905.js',\n  'data/streaming-kr-20260908.js'\n];"
                  if old not in text:
                      raise SystemExit(f'loader anchor missing in {path}')
                  text = text.replace(old, new, 1)
                  path.write_text(text)

          path = Path('anime-links.js')
          text = path.read_text()
          if '/data/streaming-kr-20260908.js' not in text:
              old = "    .then(() => loadScript('/data/streaming-us-20260906.js?v=20260906-region1'))\n    .then(() => loadScript('/streaming-region-country-default.js?v=20260906-country1'))"
              new = "    .then(() => loadScript('/data/streaming-us-20260906.js?v=20260906-region1'))\n    .then(() => loadScript('/data/streaming-kr-20260908.js?v=20260913-region2'))\n    .then(() => loadScript('/streaming-region-country-default.js?v=20260906-country1'))"
              if old not in text:
                  raise SystemExit('anime-links loader anchor missing')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit loader fix and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-kr-streaming-loader-20260913.yml
          git add scripts/enhance-streaming-regions.js scripts/validate-regional-streaming.js scripts/validate-streaming-regions.js anime-links.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Load Korean streaming audit on detail pages [skip ci]"
          git push
