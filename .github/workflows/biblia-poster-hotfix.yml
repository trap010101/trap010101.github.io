name: Refresh Biblia poster

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/biblia-poster-hotfix.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official Biblia teaser poster
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -A 'Mozilla/5.0' \
            'https://biblia-anime.com/assets/images/pc/teaser/img_hero_visual.webp' \
            -o assets/posters/biblia-bookstore.webp
          test -s assets/posters/biblia-bookstore.webp
          file assets/posters/biblia-bookstore.webp
          head -c 4 assets/posters/biblia-bookstore.webp | grep -q 'RIFF'

      - name: Remove one-off workflow
        run: rm .github/workflows/biblia-poster-hotfix.yml

      - name: Commit poster replacement
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/posters/biblia-bookstore.webp .github/workflows/biblia-poster-hotfix.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: use official Biblia teaser poster'
          git push origin HEAD:main
