name: Correct 2027 November and December sections

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-index:
    if: github.event.head_commit.message == 'Prepare corrected 2027 November and December sections'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix placement and add months
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          bad = '  ]\n  },\n  {\n    "season": "2027 가을",\n    "month": "2027-11",\n    "label": "2027년 11월",\n    "items": []\n  },\n  {\n    "season": "2027 겨울",\n    "month": "2027-12",\n    "label": "2027년 12월",\n    "items": []\n  }\n];\n\nconst posterPositions = {'
          restored = '  ]\n];\n\nconst posterPositions = {'
          if bad not in text:
              raise SystemExit('Malformed month block was not found at end of undated array')
          text = text.replace(bad, restored, 1)

          marker = '  }\n];\n\nconst undated = ['
          replacement = '  },\n  {\n    "season": "2027 가을",\n    "month": "2027-11",\n    "label": "2027년 11월",\n    "items": []\n  },\n  {\n    "season": "2027 겨울",\n    "month": "2027-12",\n    "label": "2027년 12월",\n    "items": []\n  }\n];\n\nconst undated = ['
          if marker not in text:
              raise SystemExit('Could not locate end of monthly data array')
          text = text.replace(marker, replacement, 1)

          if text.count('"month": "2027-11"') != 1 or text.count('"month": "2027-12"') != 1:
              raise SystemExit('Month entries are missing or duplicated')

          undated_block = text.split('const undated = [', 1)[1].split('const posterPositions = {', 1)[0]
          if '"season":' in undated_block or '"month": "2027-' in undated_block:
              raise SystemExit('Monthly object remains inside undated array')

          path.write_text(text, encoding='utf-8')

          script = text.rsplit('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/newanime-main.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/newanime-main.js

      - name: Commit update and remove temporary workflow
        run: |
          rm .github/workflows/temp-fix-add-2027-nov-dec.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/temp-fix-add-2027-nov-dec.yml
          git commit -m "Add 2027 November and December schedule sections"
          git push origin main
