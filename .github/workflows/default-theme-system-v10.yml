name: Default theme system v10

on:
  push:
    paths:
      - 'scripts/default-theme-system-v10.py'
      - '.github/workflows/default-theme-system-v10.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply system default theme patch
        run: python scripts/default-theme-system-v10.py
      - name: Validate JavaScript
        run: |
          node --check theme.js
          node --check language-switcher-compact.js
          node --check secondary-header.js
      - name: Commit changes and remove temporary files
        run: |
          rm scripts/default-theme-system-v10.py
          rm .github/workflows/default-theme-system-v10.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use system theme by default [skip ci]'
          git push origin main
