name: One-time theme consistency hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/theme-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch shared theme behavior and light-mode coverage
        run: python scripts/theme-hotfix.py

      - name: Validate JavaScript
        run: |
          node --check theme.js
          node --check language-switcher-compact.js
          node --check secondary-header.js

      - name: Commit hotfix and remove temporary files
        run: |
          rm .github/workflows/theme-hotfix.yml scripts/theme-hotfix.py
          git add theme.js language-switcher-compact.js secondary-header.js .github/workflows/theme-hotfix.yml scripts/theme-hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix shared theme defaults and light mode consistency [skip ci]"
          git push
