name: Generate anime, schedule, and updates pages

on:
  push:
    branches:
      - main
    paths:
      - "data/anime.js"
      - "data/anime-20260904.js"
      - "data/title-fixes-20260905.js"
      - "data/poster-fixes-20260905.js"
      - "data/official-sites-20260905.js"
      - "data/pvs.js"
      - "data/pvs-audit-20260905.js"
      - "data/platforms.js"
      - "data/streaming-regions.js"
      - "data/streaming-jp-20260906.js"
      - "data/streaming-us-20260906.js"
      - "data/streaming-policy-20260905.js"
      - "data/updates*.js"
      - "scripts/generate-anime-pages.js"
      - "scripts/enhance-streaming-regions.js"
      - "scripts/validate-regional-streaming.js"
      - "scripts/generate-schedule-pages.js"
      - "scripts/generate-updates-page.js"
      - "scripts/enhance-anime-seo.js"
      - "scripts/normalize-seo-defaults.js"
      - "scripts/inject-title-wrap-css.js"
      - "scripts/repair-lulutto-poster.js"
      - "scripts/poster-upload/lulutto-part-*.txt"
      - "anime-detail.css"
      - "anime-breadcrumb.css"
      - "detail-streaming-region.js"
      - "streaming-region-country-default.js"
      - "streaming-region-ui.js"
      - "streaming-region-compact.js"
      - "language-switcher-compact.js"
      - "title-wrap-refine.css"
      - "schedule-archive.css"
      - "updates/index.html"
      - "updates/updates.css"
      - "updates/update-links.js"
      - ".github/workflows/generate-anime-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild Lulutto Lilly poster asset
        run: node scripts/repair-lulutto-poster.js

      - name: Bust Lulutto poster data cache
        run: sed -i 's/poster-fixes-20260905.js?v=20260907-poster3/poster-fixes-20260905.js?v=20260907-poster4/' index.html

      - name: Validate regional streaming data
        run: node scripts/validate-regional-streaming.js

      - name: Generate anime detail pages
        run: node scripts/generate-anime-pages.js

      - name: Add anime SEO breadcrumbs
        run: node scripts/enhance-anime-seo.js

      - name: Add regional streaming data to anime pages
        run: node scripts/enhance-streaming-regions.js

      - name: Generate schedule archive pages
        run: node scripts/generate-schedule-pages.js

      - name: Generate static updates content
        run: node scripts/generate-updates-page.js

      - name: Normalize site SEO defaults
        run: node scripts/normalize-seo-defaults.js

      - name: Apply anime title wrapping styles
        run: node scripts/inject-title-wrap-css.js

      - name: Commit generated pages
        run: |
          git add anime 2026 2027 updates/index.html sitemap.xml index.html about/index.html privacy/index.html policy/index.html assets/posters/magical-sisters-lulutto-lilly-part-2-cropped-v2.webp
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate static anime pages [skip ci]"
          git push
