name: Light year chip state v9

on:
  push:
    branches: [main]
    paths:
      - 'scripts/light-year-chip-state-v9.py'
      - '.github/workflows/light-year-chip-state-v9.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply year chip state fix
        run: python3 scripts/light-year-chip-state-v9.py
      - name: Validate JavaScript
        run: node --check theme.js && node --check language-switcher-compact.js && node --check secondary-header.js
      - name: Commit changes and remove temporary files
        run: |
          rm -f scripts/light-year-chip-state-v9.py .github/workflows/light-year-chip-state-v9.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix light theme year filter inactive state [skip ci]'
          git push origin main
