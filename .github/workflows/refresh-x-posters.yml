name: Refresh posters from official X posts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-x-posters.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image support
        run: python -m pip install --quiet pillow

      - name: Resolve official X media and save WebP assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, urllib.request
          from pathlib import Path
          from PIL import Image

          Path('assets/posters').mkdir(parents=True, exist_ok=True)

          def fetch_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def fetch_bytes(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          def x_photo(status_id, fallback_url, dest):
              media_url = None
              for api in (
                  f'https://api.fxtwitter.com/status/{status_id}',
                  f'https://api.fxtwitter.com/i/status/{status_id}',
              ):
                  try:
                      payload = fetch_json(api)
                      tweet = payload.get('tweet') or payload
                      media = tweet.get('media') or {}
                      candidates = media.get('photos') or media.get('all') or []
                      for item in candidates:
                          if isinstance(item, str):
                              media_url = item
                              break
                          if isinstance(item, dict) and item.get('type', 'photo') == 'photo' and item.get('url'):
                              media_url = item['url']
                              break
                      if media_url:
                          break
                  except Exception as exc:
                      print(f'X resolver failed for {status_id} via {api}: {exc}')
              if not media_url:
                  media_url = fallback_url
                  print(f'Using official-site fallback for {status_id}: {media_url}')
              else:
                  print(f'Resolved X media for {status_id}: {media_url}')

              raw = fetch_bytes(media_url)
              image = Image.open(io.BytesIO(raw)).convert('RGB')
              image.save(dest, 'WEBP', quality=90, method=6)
              print(f'Saved {dest}: {image.size[0]}x{image.size[1]}')

          x_photo(
              '2095708679857213795',
              'https://ansatsu-kizoku.jp/wp-content/uploads/2026/04/img.png',
              'assets/posters/worlds-finest-assassin-s2.webp'
          )
          x_photo(
              '2095784141308809403',
              'https://www.bn-pictures.co.jp/keroro-anime/tv/images/KV/KV.webp',
              'assets/posters/keroro-gunso-star.webp'
          )

          p = Path('data/anime-20260904.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'src: "assets/posters/worlds-finest-assassin-s2.png"',
              'src: "assets/posters/worlds-finest-assassin-s2.webp"'
          )
          p.write_text(s, encoding='utf-8')
          PY

          rm -f assets/posters/worlds-finest-assassin-s2.png

      - name: Commit refreshed poster assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/posters/worlds-finest-assassin-s2.png \
                     assets/posters/worlds-finest-assassin-s2.webp \
                     assets/posters/keroro-gunso-star.webp \
                     data/anime-20260904.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh Keroro and Assassin posters from official posts'
          git push origin HEAD:main
