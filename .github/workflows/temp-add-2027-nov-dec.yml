name: Add 2027 November and December sections

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-index:
    if: github.event.head_commit.message == 'Prepare 2027 November and December sections'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add months
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if '"month": "2027-11"' in text or '"month": "2027-12"' in text:
              raise SystemExit('2027-11 or 2027-12 already exists')

          marker = '''  ]
