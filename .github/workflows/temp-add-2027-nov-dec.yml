              raise SystemExit('Could not locate end of data array')

          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update and remove temporary workflow
        run: |
          rm .github/workflows/temp-add-2027-nov-dec.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/temp-add-2027-nov-dec.yml
          git commit -m "Add November and December 2027 sections"
          git push origin main
