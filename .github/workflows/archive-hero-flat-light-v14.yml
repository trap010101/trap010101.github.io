name: Archive hero flat light v14

on:
  push:
    paths:
      - 'scripts/archive-hero-flat-light-v14.py'
      - '.github/workflows/archive-hero-flat-light-v14.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply archive light hero fix
        run: python scripts/archive-hero-flat-light-v14.py
      - name: Validate JavaScript
        run: |
          node --check theme.js
          node --check secondary-header.js
          node --check language-switcher-compact.js
      - name: Commit changes and remove temporary files
        run: |
          rm scripts/archive-hero-flat-light-v14.py
          rm .github/workflows/archive-hero-flat-light-v14.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove light archive hero gradient [skip ci]'
          git push origin main
