name: Fix Timid MAX from exact uploaded artwork

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-timid-max-from-staged-exact.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact uploaded WebP from staged chunks
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          from PIL import Image

          specs = [
              ('tmp/timid-q82-00.b64', 15000, '96ed11ab635aa95edc073f821054f2ce6fe9eafae41b2aa019466580b4e58b36'),
              ('tmp/timid-q82-01.b64', 15000, '620fddbb9934bae64bef7ecc511552c8b85e37b33ff1122a7fcba88cdb9e3eee'),
              ('tmp/timid-q82-02.b64', 15000, 'e38eed0990045c2d482d1b00bbae7a63d16e789f6e42f9269c66e33c18258dea'),
              ('tmp/timid-q82-r00.b64', 19000, '01a0e5b282bb6f77b11b2e3a5c0fb3923b92022832503c096955b7a6ee505537'),
              ('tmp/timid-q82-r01.b64', 19000, '2876b45b402cf7c7c03ae3b36f7bd97504141a64747dd5401c540d28f62404f4'),
              ('tmp/timid-q82-r02.b64', 19000, 'b17f8cc358a0f82d988be13f4e63dc30da2ce2cf5fc260a255e45fc7b3d567f6'),
              ('tmp/timid-q82-r03.b64', 19000, '6326154deddd55faa1688b639bbef39c76f92b392fdf7d63965a575784a56815'),
              ('tmp/timid-q82-r04.b64', 19000, 'b9ae1affc48bce8ec7f1576e7e9a209fd8eae674854aab5a540bf185a8ee5aae'),
              ('tmp/timid-q82-r05.b64', 19000, 'be87f688dfd7e0becfaa29ea81c2290f287996f0da56eb717149a962bdf9b723'),
              ('tmp/timid-q82-r06.b64', 19000, 'f3c17271d2b3a0ea3f24c94feace053d4e04df54d29bebbc4338871dc479912f'),
              ('tmp/timid-q82-r07.b64', 15108, '0f5ed05341f14b8ddaf98fc48e5882c02c8da9ca18b46ea35ded8a8d11f4fb42'),
          ]

          corrected = []
          for path_str, expected_len, expected_sha in specs:
              path = Path(path_str)
              if not path.is_file():
                  raise SystemExit(f'Missing staged chunk: {path_str}')
              text = ''.join(path.read_text(encoding='utf-8').split())
              digest = hashlib.sha256(text.encode()).hexdigest()
              print(path_str, 'len=', len(text), 'sha256=', digest)
              if len(text) == expected_len and digest == expected_sha:
                  corrected.append(text)
                  continue

              # One chunk was staged with one accidental extra character. Recover it
              # deterministically by removing the single character whose result matches
              # the exact local-conversion chunk hash.
              if len(text) == expected_len + 1:
                  repaired = None
                  for idx in range(len(text)):
                      candidate = text[:idx] + text[idx + 1:]
                      if hashlib.sha256(candidate.encode()).hexdigest() == expected_sha:
                          repaired = candidate
                          print('repaired extra character:', path_str, 'index=', idx, 'char=', repr(text[idx]))
                          break
                  if repaired is not None:
                      corrected.append(repaired)
                      continue

              raise SystemExit(f'Staged chunk mismatch: {path_str} len={len(text)} sha256={digest}')

          encoded = ''.join(corrected)
          print('base64_length=', len(encoded))
          if len(encoded) != 193108:
              raise SystemExit(f'Unexpected corrected base64 length: {len(encoded)}')

          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          print('decoded_bytes=', len(data))
          print('sha256=', digest)
          if len(data) != 144830:
              raise SystemExit(f'Unexpected decoded byte length: {len(data)}')
          if digest != '334d3ce15d77806d9778f67f06563129df4fcfcf920b5fc5c818a63adefe8770':
              raise SystemExit('Exact converted-upload SHA256 mismatch')
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Decoded file is not a real WebP RIFF container')

          target = Path('assets/posters/the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913-exact.webp')
          target.write_bytes(data)
          with Image.open(target) as image:
              print('format=', image.format, 'size=', image.size)
              if image.format != 'WEBP' or image.size != (1086, 1536):
                  raise SystemExit(f'WebP validation failed: {image.format} {image.size}')
          PY

      - name: Validate site references
        run: |
          set -euo pipefail
          grep -Fq 'the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913-exact.webp' data/poster-fixes-20260905.js
          grep -Fq 'the-timid-max-lady-took-her-shrewd-fiance-s-bet-user-20260913-exact.webp' anime/the-timid-max-lady-took-her-shrewd-fiance-s-bet/index.html

      - name: Clean staging files and commit exact repaired asset
        run: |
          set -euo pipefail
          rm -f tmp/timid-q82-*.b64 tmp/timid-q82-r*.b64 tmp/timid-max-exact-webp.part*
          rm -f .github/workflows/fix-timid-max-webp-format.yml
          rm -f .github/workflows/fix-timid-max-webp-format-v2.yml
          rm -f .github/workflows/fix-timid-max-webp-format-v3.yml
          rm -f .github/workflows/fix-timid-max-from-staged-exact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Timid MAX poster from exact uploaded artwork [skip ci]'
          git push origin main
