name: Expand US streaming coverage round 7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-us-streaming-round7-20260913.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add verified US alternatives
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('data/streaming-us-20260906.js')
          s = p.read_text()
          replacements = {
            '"reincarnated-as-a-sword-ii": {\n      hulu_us: "https://www.hulu.com/series/reincarnated-as-a-sword-200a141e-df62-4506-a7dc-d9fae32c12d5"\n    },': '"reincarnated-as-a-sword-ii": {\n      hulu_us: "https://www.hulu.com/series/reincarnated-as-a-sword-200a141e-df62-4506-a7dc-d9fae32c12d5",\n      hidive: "https://www.hidive.com/tv/reincarnated-as-a-sword"\n    },',
            '"the-eminence-in-shadow-lost-echoes": {\n      hulu_us: "https://www.hulu.com/series/the-eminence-in-shadow-66f37cf4-dba5-4511-ae26-e4092df1668b"\n    },': '"the-eminence-in-shadow-lost-echoes": {\n      hulu_us: "https://www.hulu.com/series/the-eminence-in-shadow-66f37cf4-dba5-4511-ae26-e4092df1668b",\n      hidive: "https://www.hidive.com/tv/the-eminence-in-shadow"\n    },',
            '"haikyu-the-movie-vs-the-little-giant": {\n      crunchyroll: "https://www.crunchyroll.com/series/GY8VM8MWY/haikyu"\n    },': '"haikyu-the-movie-vs-the-little-giant": {\n      crunchyroll: "https://www.crunchyroll.com/series/GY8VM8MWY/haikyu",\n      netflix: "https://www.netflix.com/title/80090673"\n    },',
            '"haikyu-monsters-go-where": {\n      crunchyroll: "https://www.crunchyroll.com/series/GY8VM8MWY/haikyu"\n    },': '"haikyu-monsters-go-where": {\n      crunchyroll: "https://www.crunchyroll.com/series/GY8VM8MWY/haikyu",\n      netflix: "https://www.netflix.com/title/80090673"\n    },'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing US anchor: {old[:90]}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          for path in [Path('index.html'), Path('anime-links.js')]:
              text = path.read_text()
              if '20260913-coverage6' not in text:
                  raise SystemExit(f'missing coverage6 cache key in {path}')
              path.write_text(text.replace('20260913-coverage6', '20260913-coverage7'))
          PY
      - name: Validate regional streaming data
        run: node scripts/validate-regional-streaming.js
      - name: Report updated sparse coverage
        run: node scripts/report-pv-streaming-gaps.js
      - name: Verify cache refresh
        run: |
          grep -n '20260913-coverage7' index.html anime-links.js
      - name: Commit expansion and clean workflow
        shell: bash
        run: |
          git rm .github/workflows/expand-us-streaming-round7-20260913.yml
          git add data/streaming-us-20260906.js index.html anime-links.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expand US previous-series streaming links"
          git push
